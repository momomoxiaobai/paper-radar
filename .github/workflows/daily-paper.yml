name: Discover daily papers

on:
  schedule:
    # GitHub cron uses UTC. 01:30 UTC = 09:30 Asia/Shanghai.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-paper
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch and score arXiv candidates
        run: python automation/discover.py
      - name: Save candidate queue
        run: |
          if git diff --quiet -- data/candidates.json data/state.json; then
            echo "No candidate changes."
            exit 0
          fi
          git config user.name "momomoxiaobai"
          git config user.email "47300579+momomoxiaobai@users.noreply.github.com"
          git add data/candidates.json data/state.json
          git commit -m "chore: refresh daily paper candidates"
          git push
