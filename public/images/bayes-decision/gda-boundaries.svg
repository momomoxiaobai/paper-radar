<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">高斯判别分析中的线性与二次决策边界</title>
  <desc id="desc">共享协方差时二次项抵消形成线性边界；各类协方差不同时得到二次曲线边界。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><style>.title{font:700 46px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#0f172a}.sub{font:400 23px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#475569}.h{font:700 28px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#0f172a}.p{font:400 21px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#334155}.small{font:500 18px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.c0{fill:#60a5fa;opacity:.85}.c1{fill:#f97316;opacity:.85}.cont0{fill:none;stroke:#2563eb;stroke-width:4}.cont1{fill:none;stroke:#ea580c;stroke-width:4}.boundary{fill:none;stroke:#7c3aed;stroke-width:8;stroke-linecap:round}</style></defs>
  <rect width="1800" height="1000" rx="36" fill="url(#bg)"/>
  <text x="85" y="85" class="title">生成式假设决定决策边界的形状</text>
  <text x="85" y="130" class="sub">GDA 先拟合 p(x|C) 和 P(C)，再由 Bayes rule 得到 P(C|x)。共享协方差产生 LDA；各类协方差产生 QDA。</text>

  <rect x="80" y="200" width="800" height="680" rx="30" class="box"/>
  <text x="125" y="260" class="h">共享协方差 Σ：线性边界</text>
  <ellipse cx="380" cy="500" rx="190" ry="105" transform="rotate(-25 380 500)" class="cont0"/>
  <ellipse cx="380" cy="500" rx="125" ry="68" transform="rotate(-25 380 500)" class="cont0" opacity=".6"/>
  <ellipse cx="650" cy="610" rx="190" ry="105" transform="rotate(-25 650 610)" class="cont1"/>
  <ellipse cx="650" cy="610" rx="125" ry="68" transform="rotate(-25 650 610)" class="cont1" opacity=".6"/>
  <g class="c0"><circle cx="320" cy="465" r="10"/><circle cx="390" cy="520" r="10"/><circle cx="430" cy="450" r="10"/><circle cx="345" cy="555" r="10"/></g>
  <g class="c1"><circle cx="610" cy="590" r="10"/><circle cx="690" cy="640" r="10"/><circle cx="710" cy="570" r="10"/><circle cx="620" cy="675" r="10"/></g>
  <path d="M260 750L760 330" class="boundary"/>
  <text x="125" y="815" class="p">相同形状与方向 → xᵀΣ⁻¹x 二次项相消</text>
  <text x="125" y="850" class="small">得到 wᵀx+b=0；这就是 Linear Discriminant Analysis 的来源。</text>

  <rect x="920" y="200" width="800" height="680" rx="30" class="box"/>
  <text x="965" y="260" class="h">各类协方差 Σ₀, Σ₁：二次边界</text>
  <ellipse cx="1210" cy="500" rx="190" ry="90" transform="rotate(-15 1210 500)" class="cont0"/>
  <ellipse cx="1210" cy="500" rx="125" ry="58" transform="rotate(-15 1210 500)" class="cont0" opacity=".6"/>
  <ellipse cx="1480" cy="590" rx="105" ry="190" transform="rotate(20 1480 590)" class="cont1"/>
  <ellipse cx="1480" cy="590" rx="65" ry="125" transform="rotate(20 1480 590)" class="cont1" opacity=".6"/>
  <g class="c0"><circle cx="1150" cy="480" r="10"/><circle cx="1230" cy="520" r="10"/><circle cx="1280" cy="465" r="10"/><circle cx="1180" cy="555" r="10"/></g>
  <g class="c1"><circle cx="1450" cy="540" r="10"/><circle cx="1500" cy="620" r="10"/><circle cx="1460" cy="690" r="10"/><circle cx="1530" cy="565" r="10"/></g>
  <path d="M1110 760C1280 700 1310 540 1370 430C1420 340 1570 345 1640 420" class="boundary"/>
  <text x="965" y="815" class="p">不同形状 → 二次项不能抵消</text>
  <text x="965" y="850" class="small">得到 xᵀAx+bᵀx+c=0；表达力更强，但参数更多、更易过拟合。</text>
  <text x="85" y="955" class="small">模型选择不是“曲线一定更好”：数据少时，共享协方差的强假设可能更稳定。</text>
</svg>
