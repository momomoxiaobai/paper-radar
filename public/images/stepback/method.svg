<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">StepBack step-level error-localized resampling</title>
  <desc id="desc">Draft trajectories are split into steps, a likely first error is localized, the valid prefix is reused, and suffixes are resampled before majority voting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081525"/><stop offset="1" stop-color="#142b3f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <text x="80" y="86" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="700">StepBack：把预算花在“第一次出错之后”</text>
  <text x="80" y="132" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="24">固定候选答案预算 B = n<tspan baseline-shift="sub" font-size="17">d</tspan> n<tspan baseline-shift="sub" font-size="17">s</tspan>，保留早期有效推理，不从头重采样</text>
  <g filter="url(#shadow)" font-family="Inter,system-ui,sans-serif">
    <rect x="76" y="210" width="360" height="540" rx="26" fill="#102438" stroke="#334155"/>
    <text x="112" y="266" fill="#e2e8f0" font-size="28" font-weight="700">1. 采样 n<tspan baseline-shift="sub" font-size="19">d</tspan> 条草稿</text>
    <g font-size="20" text-anchor="middle">
      <g transform="translate(110 330)"><rect width="72" height="56" rx="12" fill="#0f766e"/><rect x="82" width="72" height="56" rx="12" fill="#0f766e"/><rect x="164" width="72" height="56" rx="12" fill="#9f1239"/><rect x="246" width="72" height="56" rx="12" fill="#5b2135"/><text x="36" y="36" fill="white">z₁</text><text x="118" y="36" fill="white">z₂</text><text x="200" y="36" fill="white">z₃</text><text x="282" y="36" fill="white">z₄</text></g>
      <g transform="translate(110 430)"><rect width="72" height="56" rx="12" fill="#0f766e"/><rect x="82" width="72" height="56" rx="12" fill="#9f1239"/><rect x="164" width="72" height="56" rx="12" fill="#5b2135"/><rect x="246" width="72" height="56" rx="12" fill="#5b2135"/><text x="36" y="36" fill="white">z₁</text><text x="118" y="36" fill="white">z₂</text><text x="200" y="36" fill="white">z₃</text><text x="282" y="36" fill="white">z₄</text></g>
      <g transform="translate(110 530)"><rect width="72" height="56" rx="12" fill="#0f766e"/><rect x="82" width="72" height="56" rx="12" fill="#0f766e"/><rect x="164" width="72" height="56" rx="12" fill="#0f766e"/><rect x="246" width="72" height="56" rx="12" fill="#0f766e"/><text x="36" y="36" fill="white">z₁</text><text x="118" y="36" fill="white">z₂</text><text x="200" y="36" fill="white">z₃</text><text x="282" y="36" fill="white">z₄</text></g>
    </g>
    <text x="112" y="666" fill="#5eead4" font-size="20">绿色：保留的可靠前缀</text><text x="112" y="700" fill="#fda4af" font-size="20">红色：疑似首错及污染后缀</text>
    <rect x="516" y="210" width="410" height="540" rx="26" fill="#102438" stroke="#334155"/>
    <text x="552" y="266" fill="#e2e8f0" font-size="28" font-weight="700">2. 定位回滚点 ê</text>
    <text x="552" y="330" fill="#bae6fd" font-size="24">NLL 信号</text>
    <text x="552" y="372" fill="#f8fafc" font-size="23">ΔNLL<tspan baseline-shift="sub" font-size="16">t</tspan> = u<tspan baseline-shift="sub" font-size="16">t</tspan> − u<tspan baseline-shift="sub" font-size="16">t−1</tspan></text>
    <text x="552" y="430" fill="#bae6fd" font-size="24">PRM 信号</text>
    <text x="552" y="472" fill="#f8fafc" font-size="23">ΔPRM<tspan baseline-shift="sub" font-size="16">t</tspan> = r<tspan baseline-shift="sub" font-size="16">t−1</tspan> − r<tspan baseline-shift="sub" font-size="16">t</tspan></text>
    <rect x="552" y="530" width="338" height="122" rx="18" fill="#172554" stroke="#38bdf8"/>
    <text x="721" y="578" fill="#e0f2fe" font-size="22" text-anchor="middle">取第一个跨过阈值的步骤</text>
    <text x="721" y="618" fill="#7dd3fc" font-size="26" font-weight="700" text-anchor="middle">ê = min { t : Δ<tspan baseline-shift="sub" font-size="17">t</tspan> ≥ δ }</text>
    <text x="552" y="700" fill="#94a3b8" font-size="19">无显式错误：仅重采最终答案步骤</text>
    <rect x="1006" y="210" width="518" height="540" rx="26" fill="#102438" stroke="#334155"/>
    <text x="1042" y="266" fill="#e2e8f0" font-size="28" font-weight="700">3. 复用前缀，重采后缀</text>
    <g transform="translate(1050 340)" font-size="20" text-anchor="middle"><rect width="86" height="64" rx="12" fill="#0f766e"/><rect x="96" width="86" height="64" rx="12" fill="#0f766e"/><rect x="192" width="86" height="64" rx="12" fill="#0369a1"/><rect x="288" width="86" height="64" rx="12" fill="#0369a1"/><text x="43" y="40" fill="white">z₁</text><text x="139" y="40" fill="white">z₂</text><text x="235" y="40" fill="white">z′₃</text><text x="331" y="40" fill="white">z′₄</text></g>
    <g transform="translate(1050 444)" font-size="20" text-anchor="middle"><rect width="86" height="64" rx="12" fill="#0f766e"/><rect x="96" width="86" height="64" rx="12" fill="#0f766e"/><rect x="192" width="86" height="64" rx="12" fill="#0369a1"/><rect x="288" width="86" height="64" rx="12" fill="#0369a1"/><text x="43" y="40" fill="white">z₁</text><text x="139" y="40" fill="white">z₂</text><text x="235" y="40" fill="white">z″₃</text><text x="331" y="40" fill="white">z″₄</text></g>
    <path d="M1090 610h334" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1218" y="594" fill="#bae6fd" font-size="20" text-anchor="middle">B 个答案归一化多数投票</text>
    <circle cx="1456" cy="610" r="46" fill="#0f766e"/><text x="1456" y="620" fill="white" font-size="27" font-weight="700" text-anchor="middle">mode</text>
  </g>
  <path d="M448 478h54" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/><path d="M938 478h54" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="800" y="840" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="20" text-anchor="middle">依据论文 Figure 2、Eqs. (3)–(9) 与 Algorithm 1 重绘</text>
</svg>
