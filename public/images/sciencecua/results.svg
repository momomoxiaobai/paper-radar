<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#08111f"/><style>.t{fill:#fff;font:700 35px system-ui}.s{fill:#aab8ca;font:21px system-ui}.h{fill:#86efac;font:700 25px system-ui}.v{fill:#fff;font:700 26px system-ui}.c{fill:#10243a;stroke:#294e6a;stroke-width:2}</style><text x="70" y="70" class="t">ScienceCUA：初始知识库有效，执行引导演化带来第二段增益</text><text x="70" y="108" class="s">根据 Figures 1、6 与 Tables 1–3 重绘；数值为 ScienceBoard-Verified 平均成功率</text>
<rect x="70" y="160" width="710" height="410" rx="24" class="c"/><text x="105" y="210" class="h">Model-based evaluation</text>
<text x="105" y="270" class="s">Grok-4.6</text><rect x="270" y="235" width="225" height="50" rx="10" fill="#334155"/><rect x="495" y="235" width="43" height="50" fill="#0891b2"/><rect x="538" y="235" width="74" height="50" rx="0 10 10 0" fill="#7c3aed"/><text x="635" y="270" class="v">37.47 → 44.70 → 54.59</text>
<text x="105" y="360" class="s">GPT-5.5</text><rect x="270" y="325" width="308" height="50" rx="10" fill="#334155"/><rect x="578" y="325" width="35" height="50" fill="#0891b2"/><rect x="613" y="325" width="52" height="50" rx="0 10 10 0" fill="#7c3aed"/><text x="690" y="360" class="v">51.40 → 57.16 → 65.81</text>
<text x="105" y="445" class="s">灰：Vanilla　蓝：初始 Skills+References　紫：完整演化</text><text x="105" y="500" class="s">相对 Vanilla 的最大总增益：17.12 个百分点。</text>
<rect x="835" y="160" width="695" height="410" rx="24" class="c"/><text x="870" y="210" class="h">为什么不是直接注入整份文档</text><text x="870" y="275" class="s">初始库构建时间：</text><text x="870" y="320" class="v">比 VisualSkill 少 62.2%</text><text x="870" y="365" class="v">比 SkillFoundry 少 34.6%</text><text x="870" y="430" class="s">直接文档注入的示例执行耗时增加约：</text><text x="870" y="475" class="v">+49% ～ +56%</text><text x="870" y="525" class="s">原因：大上下文增加检索噪声、prefill 与操作迟延。</text>
<rect x="70" y="625" width="1460" height="170" rx="24" class="c"/><text x="105" y="675" class="h">互补性与边界</text><text x="105" y="723" class="s">Grok：skill-only 40.09，reference-only 40.62，二者同时 44.70；Native Grok Build 从 46.29 提升到 55.41。</text><text x="105" y="765" class="s">但更强模型的增益会缩小，陈旧 Skill 可能反向约束强模型；实验只覆盖 6 个科学软件，不能直接外推到通用桌面 Agent。</text>
<text x="70" y="858" class="s">工程结论：可演化知识库必须把“提议更新”和“独立复验”分开，否则一次偶然成功就会被固化成长期错误。</text></svg>
