<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900"><rect width="1700" height="900" fill="#07131e"/><style>.t{fill:#f8fafc;font:700 35px system-ui}.s{fill:#a8b8ca;font:21px system-ui}.h{fill:#86efac;font:700 25px system-ui}.b{fill:#102739;stroke:#2b5268;stroke-width:2}.a{fill:#0f766e}.r{fill:#7c3aed}.n{fill:#fff;font:700 22px system-ui}</style>
<text x="70" y="70" class="t">ScienceCUA：把文档变成可执行知识，再让失败证据驱动演化</text><text x="70" y="108" class="s">根据论文 Figure 3 与 Sections 3–4 重绘</text>
<rect x="70" y="170" width="430" height="575" rx="24" class="b"/><text x="105" y="220" class="h">1. Resource → Library</text><rect x="115" y="280" width="330" height="90" rx="18" fill="#1e3a5f"/><text x="280" y="325" class="n" text-anchor="middle">PDF / HTML / Manual</text>
<path d="M280 380 V430" stroke="#67e8f9" stroke-width="5"/><path d="M270 420 L280 440 L290 420" fill="#67e8f9"/>
<rect x="105" y="450" width="170" height="150" rx="18" class="a"/><text x="190" y="495" class="n" text-anchor="middle">Skills</text><text x="190" y="535" class="s" text-anchor="middle">目标导向流程</text><text x="190" y="570" class="s" text-anchor="middle">步骤 / 边界</text>
<rect x="295" y="450" width="170" height="150" rx="18" class="r"/><text x="380" y="495" class="n" text-anchor="middle">References</text><text x="380" y="535" class="s" text-anchor="middle">语法 / 参数</text><text x="380" y="570" class="s" text-anchor="middle">快捷键 / 约束</text><text x="105" y="665" class="s">每条知识保留文档证据，</text><text x="105" y="702" class="s">避免从失败轨迹臆造“经验”。</text>
<path d="M520 455 H605" stroke="#67e8f9" stroke-width="6"/><path d="M590 442 L615 455 L590 468" fill="#67e8f9"/>
<rect x="620" y="170" width="470" height="575" rx="24" class="b"/><text x="655" y="220" class="h">2. 执行与失败诊断</text>
<rect x="665" y="280" width="380" height="90" rx="18" fill="#164e63"/><text x="855" y="325" class="n" text-anchor="middle">Scientific CUA Task</text><path d="M855 380 V425" stroke="#67e8f9" stroke-width="5"/>
<rect x="665" y="445" width="380" height="190" rx="18" fill="#172554"/><text x="855" y="490" class="n" text-anchor="middle">失败分类</text><text x="700" y="535" class="s">① grounding：没找到已有知识</text><text x="700" y="575" class="s">② modify：已有条目不够正确/具体</text><text x="700" y="615" class="s">③ add：文档支持但库中缺失</text><text x="655" y="690" class="s">108 个 evolution tasks 与最终测试严格分离。</text>
<path d="M1110 455 H1195" stroke="#67e8f9" stroke-width="6"/><path d="M1180 442 L1205 455 L1180 468" fill="#67e8f9"/>
<rect x="1210" y="170" width="420" height="575" rx="24" class="b"/><text x="1245" y="220" class="h">3. 独立验证后合并</text><rect x="1255" y="285" width="330" height="100" rx="18" fill="#3f1d63"/><text x="1420" y="326" class="n" text-anchor="middle">Fresh session</text><text x="1420" y="360" class="s" text-anchor="middle">重置环境，不给失败理由</text>
<path d="M1420 395 V445" stroke="#67e8f9" stroke-width="5"/><rect x="1255" y="465" width="330" height="100" rx="18" fill="#14532d"/><text x="1420" y="507" class="n" text-anchor="middle">成功才进入候选池</text><text x="1420" y="542" class="s" text-anchor="middle">validation gate</text><text x="1245" y="625" class="s">168 个 held-out verified tasks</text><text x="1245" y="663" class="s">只评估最终库，不复用演化证据。</text>
<text x="70" y="825" class="s">核心不是“把所有文档塞进 context”，而是把知识拆成程序性 Skill 与共享 Reference，并用可复现执行结果控制更新。</text></svg>
