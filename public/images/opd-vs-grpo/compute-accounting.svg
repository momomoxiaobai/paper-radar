<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GRPO 与 OPD 的逐 token 训练 FLOPs 对账</title>
  <desc id="desc">GRPO 每 token 约为十倍学生参数量，OPD 还需额外支付一次教师前向；外部教师、self-GRPO 教师与多教师合并的差异。</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="90" y="92" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#0f172a">密集监督不等于更省计算：先把每个 token 的账算清</text>
  <text x="90" y="137" font-family="system-ui,sans-serif" font-size="24" fill="#475569">论文 Section 3：忽略两者共享的 prompt context，按实际生成 token 累计训练 FLOPs</text>
  <rect x="90" y="195" width="660" height="260" rx="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="130" y="250" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#075985">GRPO</text>
  <text x="130" y="310" font-family="system-ui,sans-serif" font-size="30" fill="#0f172a">生成</text><text x="320" y="310" font-family="ui-monospace,monospace" font-size="30" fill="#0369a1">2Nₛ</text>
  <text x="130" y="360" font-family="system-ui,sans-serif" font-size="30" fill="#0f172a">重算 log-prob</text><text x="320" y="360" font-family="ui-monospace,monospace" font-size="30" fill="#0369a1">2Nₛ</text>
  <text x="130" y="410" font-family="system-ui,sans-serif" font-size="30" fill="#0f172a">反向与更新</text><text x="320" y="410" font-family="ui-monospace,monospace" font-size="30" fill="#0369a1">6Nₛ</text>
  <text x="505" y="360" font-family="ui-monospace,monospace" font-size="56" font-weight="700" fill="#075985">10Nₛ</text>
  <rect x="850" y="195" width="660" height="260" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="890" y="250" font-family="system-ui,sans-serif" font-size="34" font-weight="700" fill="#92400e">reverse-KL OPD</text>
  <text x="890" y="310" font-family="system-ui,sans-serif" font-size="30" fill="#0f172a">学生生成、重算、更新</text><text x="1255" y="310" font-family="ui-monospace,monospace" font-size="30" fill="#b45309">10Nₛ</text>
  <text x="890" y="365" font-family="system-ui,sans-serif" font-size="30" fill="#0f172a">冻结教师逐 token 前向</text><text x="1255" y="365" font-family="ui-monospace,monospace" font-size="30" fill="#b45309">+ 2Nₜ</text>
  <text x="890" y="415" font-family="system-ui,sans-serif" font-size="22" fill="#78350f">教师越大、输出越长，每个优化步越贵</text>
  <path d="M420 490 V555 H1180 V490" fill="none" stroke="#64748b" stroke-width="4"/>
  <text x="560" y="595" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#0f172a">比较轴：held-out accuracy / 累计 EFLOPs，而非 step 数或 GPU 小时</text>
  <g font-family="system-ui,sans-serif">
    <rect x="90" y="650" width="440" height="155" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="695" font-size="28" font-weight="700" fill="#991b1b">外部 post-trained 教师</text>
    <text x="120" y="740" font-size="23" fill="#7f1d1d">九类消融中总体输给 GRPO</text>
    <text x="120" y="778" font-size="23" fill="#7f1d1d">且常出现响应长度膨胀</text>
    <rect x="580" y="650" width="440" height="155" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="610" y="695" font-size="28" font-weight="700" fill="#166534">self-GRPO 教师</text>
    <text x="610" y="740" font-size="23" fill="#14532d">同源 checkpoint 可完整回收</text>
    <text x="610" y="778" font-size="23" fill="#14532d">G=1 时蒸馏阶段少 50× FLOPs</text>
    <rect x="1070" y="650" width="440" height="155" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="1100" y="695" font-size="28" font-weight="700" fill="#5b21b6">多领域、多教师</text>
    <text x="1100" y="740" font-size="23" fill="#4c1d95">专家并行训练后按域路由 KL</text>
    <text x="1100" y="778" font-size="23" fill="#4c1d95">合并模型才是 OPD 的独特价值</text>
  </g>
</svg>
