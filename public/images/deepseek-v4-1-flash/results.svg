<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><rect width="1800" height="1000" fill="#08111f"/><style>.t{fill:#fff;font:700 36px system-ui}.s{fill:#a9b8ca;font:21px system-ui}.h{fill:#67e8f9;font:700 25px system-ui}.v{fill:#fff;font:700 27px system-ui}.b{fill:#10253b;stroke:#31516d;stroke-width:2}</style><text x="70" y="70" class="t">DeepSeek-V4.1-Flash：效率优先，但不是所有能力都超过 V4-Pro 与闭源前沿</text><text x="70" y="108" class="s">根据技术报告 Tables 1、3、4 与 Figure 9 重绘；不同 benchmark 的 harness 与采样设置见正文</text>
<rect x="70" y="155" width="800" height="360" rx="24" class="b"/><text x="105" y="205" class="h">Base model：V4.1-Flash / V4-Pro</text><text x="105" y="265" class="s">MMLU-Pro</text><text x="355" y="265" class="v">74.1 / 73.5</text><text x="105" y="320" class="s">HumanEval</text><text x="355" y="320" class="v">79.4 / 76.8</text><text x="105" y="375" class="s">BigCodeBench</text><text x="355" y="375" class="v">60.6 / 59.2</text><text x="500" y="265" class="s">LongBench-V2</text><text x="735" y="265" class="v">45.2 / 51.5</text><text x="500" y="320" class="s">SimpleQA</text><text x="735" y="320" class="v">42.3 / 55.2</text><text x="105" y="455" class="s">更小 KV 与激活量换来强代码/通识，但长上下文理解与事实问答并未全面领先。</text>
<rect x="930" y="155" width="800" height="360" rx="24" class="b"/><text x="965" y="205" class="h">Instruct / Agent：V4.1-Flash</text><text x="965" y="265" class="s">Terminal-Bench 2.1</text><text x="1285" y="265" class="v">90.6</text><text x="965" y="320" class="s">DeepSWE v1.1</text><text x="1285" y="320" class="v">74.2</text><text x="965" y="375" class="s">HLE with tools</text><text x="1285" y="375" class="v">63.9</text><text x="1400" y="265" class="s">TB 4.0</text><text x="1640" y="265" class="v">31.2</text><text x="1400" y="320" class="s">HLE</text><text x="1640" y="320" class="v">36.8</text><text x="965" y="455" class="s">强项是工程 Agent；最难通用推理、专业科学与安全任务仍有明显空档。</text>
<rect x="70" y="570" width="1660" height="290" rx="24" class="b"/><text x="105" y="620" class="h">连续 reasoning effort：一套权重学习成本—质量曲线</text><text x="105" y="690" class="s">effort 25 → 100</text><rect x="340" y="655" width="520" height="55" rx="12" fill="#0e7490"/><text x="885" y="693" class="v">平均 reasoning Pass@1：67.1 → 76.3</text><text x="105" y="770" class="s">DeepSWE：66.0 → 74.2；Terminal-Bench 2.1：82.4 → 90.6；输出 token 约增加 2.5×。</text><text x="105" y="815" class="s">收益前置：60–80 已拿到大部分精度；80→100 的 agent trajectory 增长 1.6–1.8×，边际收益较小。</text>
<text x="70" y="930" class="s">训练秘诀并非新 RL 算法：标准 SFT → RL → OPD；主要投入在任务合成、可验证环境、数百万并发 sandbox 与跨 harness 数据。</text></svg>
