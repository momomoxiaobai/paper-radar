<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><rect width="1800" height="1000" fill="#07111f"/><style>.t{fill:#fff;font:700 36px system-ui}.s{fill:#a9b8ca;font:21px system-ui}.h{fill:#67e8f9;font:700 25px system-ui}.b{fill:#10263c;stroke:#31536f;stroke-width:2}.n{fill:#fff;font:700 22px system-ui}</style><text x="70" y="70" class="t">DeepSeek-V4.1-Flash：CED + CSA2 如何把长上下文 KV 压到 890 bytes/token</text><text x="70" y="108" class="s">根据技术报告 Figures 2–5 与 Sections 2–3 重绘</text>
<rect x="70" y="160" width="780" height="690" rx="24" class="b"/><text x="105" y="210" class="h">Causal Encoder–Decoder（40 层 = 20 + 20）</text>
<rect x="125" y="285" width="260" height="430" rx="22" fill="#164e63"/><text x="255" y="335" class="n" text-anchor="middle">20-layer Encoder</text><text x="255" y="385" class="s" text-anchor="middle">处理全部 prompt</text><text x="255" y="430" class="s" text-anchor="middle">8B activated/token</text><text x="255" y="475" class="s" text-anchor="middle">64K → 1M context</text><text x="255" y="540" class="n" text-anchor="middle">H^(L/2)</text>
<path d="M400 500 H500" stroke="#67e8f9" stroke-width="7"/><path d="M485 486 L512 500 L485 514" fill="#67e8f9"/>
<rect x="515" y="285" width="270" height="430" rx="22" fill="#4c1d95"/><text x="650" y="335" class="n" text-anchor="middle">20-layer Decoder</text><text x="650" y="385" class="s" text-anchor="middle">decode + replay</text><text x="650" y="430" class="s" text-anchor="middle">16B activated/token</text><text x="650" y="485" class="s" text-anchor="middle">Cˡ = H^(L/2)Wᵏᵛˡ</text><text x="650" y="525" class="s" text-anchor="middle">Zˡ = H^(L/2)Wᶻˡ</text><text x="650" y="590" class="s" text-anchor="middle">decoder global KV</text><text x="650" y="625" class="s" text-anchor="middle">不再逐层依赖 prompt hidden</text>
<text x="105" y="780" class="s">Prefill：O(NL) → O(NL/2 + nwin·L/2) ≈ O(NL/2)</text>
<rect x="900" y="160" width="830" height="690" rx="24" class="b"/><text x="935" y="210" class="h">CSA2：跨层复用 KV、索引器 K 与 Top-K 位置</text>
<g transform="translate(960 285)"><rect width="220" height="110" rx="18" fill="#0e7490"/><text x="110" y="48" class="n" text-anchor="middle">Full</text><text x="110" y="82" class="s" text-anchor="middle">全上下文建候选池</text><path d="M230 55 H290" stroke="#67e8f9" stroke-width="6"/><rect x="300" width="220" height="110" rx="18" fill="#6d28d9"/><text x="410" y="48" class="n" text-anchor="middle">Reindex</text><text x="410" y="82" class="s" text-anchor="middle">候选池内重选</text><path d="M530 55 H590" stroke="#67e8f9" stroke-width="6"/><rect x="600" width="180" height="110" rx="18" fill="#166534"/><text x="690" y="48" class="n" text-anchor="middle">Reuse</text><text x="690" y="82" class="s" text-anchor="middle">复用 indices</text></g>
<text x="935" y="460" class="s">Hierarchical Sparse Indexer：</text><text x="935" y="505" class="n">2048 blocks × 8 positions = 16384 candidates</text><text x="935" y="550" class="s">每层 sparse attention 最终 Top-K = 512；SWA window = 128。</text>
<rect x="955" y="610" width="345" height="120" rx="18" fill="#172554"/><text x="1127" y="655" class="n" text-anchor="middle">FP4 global KV</text><text x="1127" y="695" class="s" text-anchor="middle">E2M1 + E4M3 scale / 16 ch</text><rect x="1330" y="610" width="330" height="120" rx="18" fill="#7c2d12"/><text x="1495" y="655" class="n" text-anchor="middle">890 bytes/token</text><text x="1495" y="695" class="s" text-anchor="middle">≈ V4-Flash 的 1/4</text>
<text x="935" y="790" class="s">SWA Bounded Replay 只重放最后 nwin 个 token，使持久 KV 约降到 V4 的 1/8。</text>
<text x="70" y="930" class="s">模型规模：552B backbone + 196B Engram；每层 1 shared + 384 routed experts，token 激活 6 个 routed experts。</text></svg>
