<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">从 ID3 到现代树模型</title><desc id="d">展示 ID3、C4.5、CART、随机森林与梯度提升树的关系</desc><rect width="1600" height="900" fill="#fbfaf6"/><g font-family="sans-serif" fill="#172033"><text x="800" y="70" text-anchor="middle" font-size="40" font-weight="700">今天常用的树，都继承了 1986 年的核心递归</text><g font-size="25" font-weight="700"><rect x="90" y="170" width="300" height="170" rx="28" fill="#e9efff"/><text x="240" y="225" text-anchor="middle">ID3</text><text x="240" y="270" text-anchor="middle" font-size="19" font-weight="400">多叉离散分裂</text><text x="240" y="302" text-anchor="middle" font-size="19" font-weight="400">information gain</text><rect x="475" y="170" width="300" height="170" rx="28" fill="#eaf8f2"/><text x="625" y="225" text-anchor="middle">C4.5</text><text x="625" y="270" text-anchor="middle" font-size="19" font-weight="400">gain ratio / 连续值</text><text x="625" y="302" text-anchor="middle" font-size="19" font-weight="400">缺失值 / pruning</text><rect x="860" y="170" width="300" height="170" rx="28" fill="#fff1df"/><text x="1010" y="225" text-anchor="middle">CART</text><text x="1010" y="270" text-anchor="middle" font-size="19" font-weight="400">二叉分裂</text><text x="1010" y="302" text-anchor="middle" font-size="19" font-weight="400">Gini / squared error</text><rect x="1245" y="170" width="270" height="170" rx="28" fill="#f0eaff"/><text x="1380" y="225" text-anchor="middle">现代库</text><text x="1380" y="270" text-anchor="middle" font-size="19" font-weight="400">正则、权重、并行</text><text x="1380" y="302" text-anchor="middle" font-size="19" font-weight="400">高效 histogram</text></g><path d="M390 255 H475 M775 255 H860 M1160 255 H1245" stroke="#6d7890" stroke-width="6"/><g><rect x="180" y="520" width="500" height="210" rx="30" fill="#172033"/><text x="430" y="580" text-anchor="middle" font-size="28" font-weight="700" fill="white">Bagging 路线</text><text x="430" y="630" text-anchor="middle" font-size="22" fill="#dce4f5">Bootstrap 多棵深树 + 随机特征</text><text x="430" y="680" text-anchor="middle" font-size="25" fill="#9dc8ff">Random Forest</text><rect x="920" y="520" width="500" height="210" rx="30" fill="#172033"/><text x="1170" y="580" text-anchor="middle" font-size="28" font-weight="700" fill="white">Boosting 路线</text><text x="1170" y="630" text-anchor="middle" font-size="22" fill="#dce4f5">逐棵拟合残差 / 梯度</text><text x="1170" y="680" text-anchor="middle" font-size="25" fill="#ffcf8a">GBDT / XGBoost / LightGBM</text></g><path d="M1010 340 C1010 430 430 430 430 520 M1010 340 C1010 430 1170 430 1170 520" fill="none" stroke="#6d7890" stroke-width="6"/><text x="800" y="825" text-anchor="middle" font-size="22">共同骨架：在当前样本子集上选择分裂 → 划分子集 → 递归 → 用停止 / 剪枝控制泛化</text></g></svg>
