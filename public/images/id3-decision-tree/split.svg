<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">ID3 信息增益分裂</title><desc id="d">用天气数据说明父节点熵、条件熵和信息增益</desc><rect width="1600" height="900" fill="#fbfaf6"/><g font-family="sans-serif" fill="#172033"><text x="800" y="70" text-anchor="middle" font-size="40" font-weight="700">ID3：选一个问题，让答案后的不确定性降得最多</text><rect x="570" y="130" width="460" height="150" rx="30" fill="#172033"/><text x="800" y="190" text-anchor="middle" font-size="24" fill="white">14 个周六：9 个适合，5 个不适合</text><text x="800" y="235" text-anchor="middle" font-size="24" fill="#cfd8ed">H(Y) = 0.940 bit</text><path d="M800 280 V350 M800 350 H300 M800 350 H1300" stroke="#6d7890" stroke-width="6" fill="none"/><text x="800" y="335" text-anchor="middle" font-size="22">测试 outlook</text><g><rect x="120" y="400" width="360" height="190" rx="28" fill="#fff1df" stroke="#e58a31" stroke-width="4"/><text x="300" y="455" text-anchor="middle" font-size="28" font-weight="700">sunny</text><text x="300" y="505" text-anchor="middle" font-size="23">2 P / 3 N</text><text x="300" y="550" text-anchor="middle" font-size="23">H = 0.971</text><rect x="620" y="400" width="360" height="190" rx="28" fill="#eaf8f2" stroke="#2d9b70" stroke-width="4"/><text x="800" y="455" text-anchor="middle" font-size="28" font-weight="700">overcast</text><text x="800" y="505" text-anchor="middle" font-size="23">4 P / 0 N</text><text x="800" y="550" text-anchor="middle" font-size="23">H = 0</text><rect x="1120" y="400" width="360" height="190" rx="28" fill="#e9efff" stroke="#5f82e6" stroke-width="4"/><text x="1300" y="455" text-anchor="middle" font-size="28" font-weight="700">rain</text><text x="1300" y="505" text-anchor="middle" font-size="23">3 P / 2 N</text><text x="1300" y="550" text-anchor="middle" font-size="23">H = 0.971</text></g><rect x="300" y="680" width="1000" height="130" rx="28" fill="#5b4bd6"/><text x="800" y="730" text-anchor="middle" font-size="28" font-weight="700" fill="white">H(Y | outlook) = 0.694</text><text x="800" y="775" text-anchor="middle" font-size="26" fill="#eeeaff">IG = 0.940 − 0.694 = 0.246 bit（四个候选属性中最大）</text></g></svg>
