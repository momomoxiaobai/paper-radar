<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Nebula distributed PIC workflow</title><desc id="d">Application segments are matched, tracked and scheduled to scatter, reuse and combine prefill.</desc>
  <rect width="1600" height="900" rx="32" fill="#f6f8fc"/><text x="80" y="78" font-family="system-ui,sans-serif" font-size="38" font-weight="700" fill="#172033">从应用片段到分布式 PIC 执行计划</text>
  <g font-family="system-ui,sans-serif"><rect x="75" y="135" width="350" height="620" rx="28" fill="#e8efff" stroke="#6c8dd5" stroke-width="3"/><text x="110" y="190" font-size="28" font-weight="700" fill="#254b91">应用与匹配</text>
  <rect x="110" y="230" width="280" height="90" rx="16" fill="#fff"/><text x="135" y="270" font-size="22" fill="#24324a">Prefix match</text><text x="135" y="300" font-size="18" fill="#65728a">严格共同前缀</text>
  <rect x="110" y="350" width="280" height="125" rx="16" fill="#fff"/><text x="135" y="390" font-size="22" fill="#24324a">PIC match</text><text x="135" y="425" font-size="18" fill="#65728a">&lt;pic&gt; 文档 / 工具返回</text><text x="135" y="452" font-size="18" fill="#65728a">content hash → segment</text>
  <rect x="110" y="515" width="280" height="180" rx="16" fill="#d6e3ff"/><text x="135" y="558" font-size="22" font-weight="700" fill="#254b91">执行计划 π=(c,a)</text><text x="135" y="600" font-size="18" fill="#334666">c：combine home</text><text x="135" y="632" font-size="18" fill="#334666">a(i)：缓存源 / 计算点</text><text x="135" y="664" font-size="18" fill="#334666">最小化预计完成时间</text>
  <rect x="510" y="135" width="490" height="620" rx="28" fill="#ecf8f3" stroke="#4d9b7c" stroke-width="3"/><text x="545" y="190" font-size="28" font-weight="700" fill="#216b51">控制面：同一份集群视图</text>
  <rect x="545" y="230" width="420" height="125" rx="16" fill="#fff"/><text x="570" y="270" font-size="22" font-weight="700" fill="#225c49">Cluster View</text><text x="570" y="305" font-size="18" fill="#526a61">乐观登记 in-flight → 及时</text><text x="570" y="334" font-size="18" fill="#526a61">worker event 确认/驱逐 → 真实</text>
  <rect x="545" y="385" width="420" height="135" rx="16" fill="#fff"/><text x="570" y="425" font-size="22" font-weight="700" fill="#225c49">Cache Manager</text><text x="570" y="462" font-size="18" fill="#526a61">PC / PIC resident + ghost queues</text><text x="570" y="492" font-size="18" fill="#526a61">每窗口最多调整 1% 软份额</text>
  <rect x="545" y="550" width="420" height="145" rx="16" fill="#fff"/><text x="570" y="590" font-size="22" font-weight="700" fill="#225c49">Prefill Scheduler</text><text x="570" y="627" font-size="18" fill="#526a61">max(queue + compute + transfer)</text><text x="570" y="657" font-size="18" fill="#526a61">枚举 combine home，贪心分散冷片段</text>
  <rect x="1085" y="135" width="440" height="620" rx="28" fill="#fff2e7" stroke="#d58a42" stroke-width="3"/><text x="1120" y="190" font-size="28" font-weight="700" fill="#934d18">数据面：三路重叠</text>
  <rect x="1120" y="230" width="370" height="105" rx="16" fill="#fff"/><text x="1150" y="276" font-size="22" font-weight="700" fill="#7b451e">Scatter prefill</text><text x="1150" y="308" font-size="18" fill="#765b48">冷 PIC 在空闲 worker 并行计算</text>
  <rect x="1120" y="370" width="370" height="105" rx="16" fill="#fff"/><text x="1150" y="416" font-size="22" font-weight="700" fill="#7b451e">Remote cache reuse</text><text x="1150" y="448" font-size="18" fill="#765b48">PC/PIC KV 直传 combine GPU</text>
  <rect x="1120" y="510" width="370" height="135" rx="16" fill="#ffe0c4"/><text x="1150" y="556" font-size="22" font-weight="700" fill="#7b451e">Combine prefill</text><text x="1150" y="590" font-size="18" fill="#765b48">backend 重算 + regular content</text><text x="1150" y="620" font-size="18" fill="#765b48">完成后交给 decode worker</text>
  <path d="M425 445H500" stroke="#456aab" stroke-width="8" marker-end="url(#a)"/><path d="M1000 445H1075" stroke="#3a8066" stroke-width="8" marker-end="url(#a)"/>
  <rect x="250" y="800" width="1100" height="55" rx="20" fill="#172033"/><text x="800" y="836" text-anchor="middle" font-size="21" fill="#fff">PIC backend 决定精度；Nebula 决定片段在哪里、谁来算、何时搬</text></g>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#4b6385"/></marker></defs>
</svg>
