<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Nebula evidence summary</title><desc id="d">Charts summarize prefix miss recovery, TTFT and component improvements.</desc><rect width="1600" height="900" rx="32" fill="#f7f9fc"/>
  <g font-family="system-ui,sans-serif"><text x="80" y="75" font-size="38" font-weight="700" fill="#172033">证据：PIC 机会、端到端收益与组件因果链</text>
  <rect x="65" y="120" width="470" height="680" rx="28" fill="#eaf1ff"/><text x="100" y="175" font-size="27" font-weight="700" fill="#27518f">PC miss 回收率 PMRR</text>
  <g font-size="18" fill="#34435a"><text x="105" y="230">doc2dial</text><rect x="215" y="208" width="270" height="28" rx="8" fill="#497dcc"/><text x="465" y="229" text-anchor="end" fill="#fff">99.7%</text><text x="105" y="290">QuAC</text><rect x="215" y="268" width="236" height="28" rx="8" fill="#497dcc"/><text x="440" y="289" text-anchor="end" fill="#fff">87.1%</text><text x="105" y="350">RAGPulse</text><rect x="215" y="328" width="160" height="28" rx="8" fill="#497dcc"/><text x="365" y="349" text-anchor="end" fill="#fff">59.1%</text><text x="105" y="430">SWE-agent</text><rect x="215" y="408" width="127" height="28" rx="8" fill="#46a079"/><text x="332" y="429" text-anchor="end" fill="#fff">47.0%</text><text x="105" y="490">τ-bench</text><rect x="215" y="468" width="149" height="28" rx="8" fill="#46a079"/><text x="354" y="489" text-anchor="end" fill="#fff">55.1%</text><text x="105" y="550">ChatDev</text><rect x="215" y="528" width="229" height="28" rx="8" fill="#46a079"/><text x="434" y="549" text-anchor="end" fill="#fff">84.7%</text></g>
  <text x="100" y="635" font-size="19" fill="#58677d">Agent 的绝对 NPHR 可能很小，</text><text x="100" y="666" font-size="19" fill="#58677d">但剩余 miss 中仍有近半可回收。</text>
  <rect x="565" y="120" width="455" height="680" rx="28" fill="#ecf8f3"/><text x="600" y="175" font-size="27" font-weight="700" fill="#226c52">端到端（平均 / 最高测试率）</text>
  <text x="600" y="250" font-size="64" font-weight="750" fill="#1f7556">−61.4%</text><text x="600" y="285" font-size="19" fill="#51675e">median TTFT vs Local-PIC</text><text x="600" y="350" font-size="64" font-weight="750" fill="#1f7556">76.1%</text><text x="600" y="385" font-size="19" fill="#51675e">平均回收 PC miss tokens</text>
  <text x="600" y="455" font-size="21" font-weight="700" fill="#304b40">最高测试率 median TTFT（秒）</text><text x="600" y="505" font-size="18" fill="#51675e">ChatRAG</text><text x="950" y="505" text-anchor="end" font-size="18" fill="#1f7556">0.24 vs 1.26</text><text x="600" y="550" font-size="18" fill="#51675e">RAGPulse</text><text x="950" y="550" text-anchor="end" font-size="18" fill="#1f7556">0.79 vs 2.39</text><text x="600" y="595" font-size="18" fill="#51675e">τ-bench</text><text x="950" y="595" text-anchor="end" font-size="18" fill="#1f7556">0.18 vs 3.64</text><text x="600" y="640" font-size="18" fill="#51675e">ChatDev</text><text x="950" y="640" text-anchor="end" font-size="18" fill="#1f7556">0.24 vs 9.57</text><text x="600" y="710" font-size="17" fill="#687970">对照：Local-PIC + Dynamo</text>
  <rect x="1050" y="120" width="485" height="680" rx="28" fill="#fff2e7"/><text x="1085" y="175" font-size="27" font-weight="700" fill="#8c4b1e">三组组件证据（40 QPS 等设置）</text>
  <g font-size="20" fill="#5d493a"><text x="1090" y="245" font-weight="700">目录同步</text><text x="1090" y="282">invalid hit</text><text x="1490" y="282" text-anchor="end" fill="#b15b20">−98.4% / −100%</text><text x="1090" y="320">重复计算</text><text x="1490" y="320" text-anchor="end" fill="#b15b20">−96.1% / −95.1%</text><line x1="1090" y1="350" x2="1490" y2="350" stroke="#e1b991" stroke-width="2"/><text x="1090" y="405" font-weight="700">PC/PIC 容量</text><text x="1090" y="442">RAGPulse median TTFT</text><text x="1490" y="442" text-anchor="end" fill="#b15b20">−11.5% / −14.7%</text><line x1="1090" y1="475" x2="1490" y2="475" stroke="#e1b991" stroke-width="2"/><text x="1090" y="530" font-weight="700">联合调度</text><text x="1090" y="567">compute CV vs locality</text><text x="1490" y="567" text-anchor="end" fill="#b15b20">−93.6% / −90.3%</text><text x="1090" y="605">traffic vs load-only</text><text x="1490" y="605" text-anchor="end" fill="#b15b20">−38.1% / −12.3%</text></g><text x="1090" y="705" font-size="17" fill="#7b6a5c">每组只替换对应机制，其他组件固定</text></g>
</svg>
