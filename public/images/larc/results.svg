<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="900"
  viewBox="0 0 1600 900"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">LARC 相对 BAGEL 的关键结果</title>
  <desc id="desc">
    展示 GenEval、DPG-Bench、OneIG-Bench、CompBench 与 MIRA 上的真实对比结果。
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08111f" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)" />
  <text
    x="90"
    y="90"
    fill="#f8fafc"
    font-family="Inter, PingFang SC, sans-serif"
    font-size="42"
    font-weight="700"
  >
    LARC 的收益主要落在组合生成、编辑与视觉推理
  </text>
  <text
    x="90"
    y="136"
    fill="#94a3b8"
    font-family="Inter, PingFang SC, sans-serif"
    font-size="21"
  >
    根据论文 Tables 1-8 重绘；所有数字均为论文报告值
  </text>

  <g font-family="Inter, PingFang SC, sans-serif">
    <text x="110" y="230" fill="#e2e8f0" font-size="25" font-weight="700">
      文本生成图像 / 提示遵循
    </text>
    <text x="110" y="300" fill="#cbd5e1" font-size="22">GenEval</text>
    <text x="310" y="300" fill="#94a3b8" font-size="20">BAGEL 0.81</text>
    <rect x="520" y="270" width="620" height="42" rx="21" fill="#1e293b" />
    <rect x="520" y="270" width="546" height="42" rx="21" fill="url(#bar)" />
    <text x="1090" y="301" fill="#fff" font-size="23" font-weight="700">
      LARC 0.88
    </text>

    <text x="110" y="382" fill="#cbd5e1" font-size="22">DPG-Bench</text>
    <text x="310" y="382" fill="#94a3b8" font-size="20">BAGEL 85.07</text>
    <rect x="520" y="352" width="620" height="42" rx="21" fill="#1e293b" />
    <rect x="520" y="352" width="558" height="42" rx="21" fill="url(#bar)" />
    <text x="1090" y="383" fill="#fff" font-size="23" font-weight="700">
      LARC 90.04
    </text>

    <text x="110" y="464" fill="#cbd5e1" font-size="22">OneIG-Bench</text>
    <text x="310" y="464" fill="#94a3b8" font-size="20">BAGEL 0.764</text>
    <rect x="520" y="434" width="620" height="42" rx="21" fill="#1e293b" />
    <rect x="520" y="434" width="537" height="42" rx="21" fill="url(#bar)" />
    <text x="1090" y="465" fill="#fff" font-size="23" font-weight="700">
      LARC 0.866
    </text>

    <line
      x1="90"
      y1="520"
      x2="1510"
      y2="520"
      stroke="#334155"
      stroke-width="2"
    />
    <text x="110" y="584" fill="#e2e8f0" font-size="25" font-weight="700">
      编辑与视觉推理
    </text>

    <rect
      x="110"
      y="626"
      width="420"
      height="168"
      rx="24"
      fill="#0f2138"
      stroke="#334155"
    />
    <text x="145" y="670" fill="#94a3b8" font-size="20">CompBench LC-T</text>
    <text x="145" y="727" fill="#f8fafc" font-size="42" font-weight="700">
      20.43 → 22.51
    </text>
    <text x="145" y="770" fill="#67e8f9" font-size="20">
      更贴合局部编辑指令
    </text>

    <rect
      x="590"
      y="626"
      width="420"
      height="168"
      rx="24"
      fill="#0f2138"
      stroke="#334155"
    />
    <text x="625" y="670" fill="#94a3b8" font-size="20">CompBench LPIPS ↓</text>
    <text x="625" y="727" fill="#f8fafc" font-size="42" font-weight="700">
      0.069 → 0.049
    </text>
    <text x="625" y="770" fill="#67e8f9" font-size="20">
      更好保留未编辑区域
    </text>

    <rect
      x="1070"
      y="626"
      width="420"
      height="168"
      rx="24"
      fill="#171a3a"
      stroke="#4f46e5"
    />
    <text x="1105" y="670" fill="#a5b4fc" font-size="20">MIRA 视觉推理</text>
    <text x="1105" y="727" fill="#f8fafc" font-size="42" font-weight="700">
      7.5 → 11.7
    </text>
    <text x="1105" y="770" fill="#c4b5fd" font-size="20">
      Stage 2 RL 继续拉开差距
    </text>
  </g>
</svg>
