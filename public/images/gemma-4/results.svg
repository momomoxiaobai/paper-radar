<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Gemma 4 benchmark and memory results</title><desc id="desc">Selected performance, long-context, audio, and quantized memory results from the Gemma 4 report.</desc><rect width="1600" height="900" rx="30" fill="#0a1422"/><text x="80" y="86" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="700">跨代提升很大，但横向比较必须带着评测口径</text><text x="80" y="132" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="23">静态 benchmark 多数开启 thinking；长上下文表则关闭 thinking；Arena 截止 2026-06-19</text><g font-family="Inter,system-ui,sans-serif"><g transform="translate(70 200)"><rect width="700" height="520" rx="26" fill="#142338"/><text x="32" y="54" fill="#e2e8f0" font-size="27" font-weight="700">31B vs Gemma 3 27B</text><g font-size="20"><text x="32" y="120" fill="#cbd5e1">AIME 2026</text><rect x="230" y="92" width="375" height="34" rx="8" fill="#0ea5e9"/><rect x="230" y="133" width="87" height="22" rx="7" fill="#475569"/><text x="620" y="120" fill="#f8fafc">89.2 vs 20.8</text><text x="32" y="210" fill="#cbd5e1">LiveCodeBench v6</text><rect x="230" y="182" width="336" height="34" rx="8" fill="#0ea5e9"/><rect x="230" y="223" width="122" height="22" rx="7" fill="#475569"/><text x="580" y="210" fill="#f8fafc">80.0 vs 29.1</text><text x="32" y="300" fill="#cbd5e1">GPQA Diamond</text><rect x="230" y="272" width="354" height="34" rx="8" fill="#0ea5e9"/><rect x="230" y="313" width="178" height="22" rx="7" fill="#475569"/><text x="598" y="300" fill="#f8fafc">84.3 vs 42.4</text><text x="32" y="390" fill="#cbd5e1">RULER 128k</text><rect x="230" y="362" width="405" height="34" rx="8" fill="#14b8a6"/><rect x="230" y="403" width="277" height="22" rx="7" fill="#475569"/><text x="648" y="390" fill="#f8fafc">96.4 vs 66.0</text><text x="32" y="480" fill="#94a3b8">蓝/绿：Gemma 4 31B　灰：Gemma 3 27B</text></g></g><g transform="translate(820 200)"><rect width="710" height="520" rx="26" fill="#142338"/><text x="32" y="54" fill="#e2e8f0" font-size="27" font-weight="700">部署与多模态证据</text><g font-size="21"><text x="32" y="116" fill="#7dd3fc">31B 权重内存</text><text x="330" y="116" fill="#f8fafc">bf16 64.0 GB → Q4_0 19.2 GB</text><text x="32" y="166" fill="#7dd3fc">12B 权重内存</text><text x="330" y="166" fill="#f8fafc">bf16 24.0 GB → Q4_0 7.65 GB</text><text x="32" y="216" fill="#94a3b8">32k int8 KV 另加：31B 1.10 GB / 12B 0.28 GB</text><line x1="32" y1="250" x2="678" y2="250" stroke="#334155"/><text x="32" y="310" fill="#a7f3d0">E4B CoVoST 平均</text><text x="390" y="310" fill="#f8fafc">38.2 vs Gemma 3n 34.7</text><text x="32" y="360" fill="#a7f3d0">E4B FLEURS 平均 WER/CER</text><text x="390" y="360" fill="#f8fafc">0.075 vs 0.085</text><text x="32" y="410" fill="#a7f3d0">Audio encoder on-disk</text><text x="390" y="410" fill="#f8fafc">390 MB → 87 MB</text><text x="32" y="472" fill="#94a3b8">12B 无独立 audio encoder 仍报告可竞争 ASR/S2TT。</text></g></g><rect x="100" y="762" width="1400" height="75" rx="18" fill="#3f1d2e"/><text x="800" y="808" fill="#fecdd3" font-size="21" text-anchor="middle">报告未披露预训练 token 数、各模态数据比例、完整数据来源或同预算消融；“更强”不能被归因到某一个架构改动。</text></g></svg>
