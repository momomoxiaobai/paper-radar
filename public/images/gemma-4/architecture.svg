<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Gemma 4 model family architecture</title><desc id="desc">Gemma 4 dense and mixture-of-experts models, multimodal front ends, attention and efficiency features.</desc><rect width="1600" height="900" rx="30" fill="#0a1422"/><text x="80" y="86" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="700">Gemma 4 不是一个模型，而是一组部署点</text><text x="80" y="132" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="23">dense / MoE、独立 encoder / encoder-free、raw / QAT checkpoint 共同组成家族</text><g font-family="Inter,system-ui,sans-serif"><g transform="translate(70 205)"><rect width="1460" height="280" rx="28" fill="#142338"/><text x="32" y="52" fill="#e2e8f0" font-size="27" font-weight="700">模型矩阵（论文 Table 1）</text><g font-size="19" text-anchor="middle"><g fill="#64748b"><rect x="28" y="82" width="265" height="50" rx="12"/><rect x="312" y="82" width="265" height="50" rx="12"/><rect x="596" y="82" width="265" height="50" rx="12"/><rect x="880" y="82" width="265" height="50" rx="12"/><rect x="1164" y="82" width="265" height="50" rx="12"/></g><g fill="white" font-weight="700"><text x="160" y="114">E2B · dense</text><text x="444" y="114">E4B · dense</text><text x="728" y="114">12B · dense</text><text x="1012" y="114">26B-A4B · MoE</text><text x="1296" y="114">31B · dense</text></g><g fill="#cbd5e1"><text x="160" y="166">2.3B effective</text><text x="444" y="166">4.5B effective</text><text x="728" y="166">12B</text><text x="1012" y="166">26B total / 3.8B active</text><text x="1296" y="166">31B</text><text x="160" y="204">150M vision + 305M audio</text><text x="444" y="204">150M vision + 305M audio</text><text x="728" y="204" fill="#5eead4">raw image/audio projection</text><text x="1012" y="204">550M vision</text><text x="1296" y="204">550M vision</text></g><text x="728" y="248" fill="#94a3b8">共享 262k tokenizer；全家族提供 thinking mode 与 MTP drafter</text></g></g><g transform="translate(70 540)"><rect width="1460" height="235" rx="28" fill="#142338"/><g font-size="21"><text x="32" y="54" fill="#e2e8f0" font-size="27" font-weight="700">效率设计不是单点技巧</text><text x="32" y="110" fill="#7dd3fc">Attention</text><text x="180" y="110" fill="#cbd5e1">5:1 local/global（E2B 为 4:1）· p-RoPE · global K=V</text><text x="32" y="154" fill="#a7f3d0">Decode</text><text x="180" y="154" fill="#cbd5e1">4-layer autoregressive MTP drafter，cross-attend 主模型 KV</text><text x="32" y="198" fill="#ddd6fe">Memory</text><text x="180" y="198" fill="#cbd5e1">QAT：mobile int2/int4 + int8 activation；或 Q4_0</text><rect x="1005" y="62" width="410" height="130" rx="18" fill="#172554"/><text x="1210" y="107" fill="#bfdbfe" font-size="22" text-anchor="middle">12B encoder-free</text><text x="1210" y="145" fill="#e2e8f0" font-size="19" text-anchor="middle">48×48×3 image patch → 35M matmul</text><text x="1210" y="176" fill="#e2e8f0" font-size="19" text-anchor="middle">40ms audio chunk → LLM embedding</text></g></g><text x="800" y="842" fill="#64748b" font-size="19" text-anchor="middle">依据论文 Sections 2.1–2.7、Figure 1 与 Tables 1–3 重绘</text></g></svg>
