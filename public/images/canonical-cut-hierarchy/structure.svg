<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Canonical cut hierarchy and its graph invariants</title><desc id="desc">A nested hierarchy of finest Tutte-Nash-Williams partitions stores strength and arboricity.</desc><rect width="1600" height="900" rx="30" fill="#091522"/><text x="80" y="86" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="700">一棵 O(n) 大小的树，压缩多个图不变量</text><text x="80" y="132" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="23">每个内部节点 X 按 G[X] 的最细 Tutte–Nash–Williams 最优分割继续拆分</text><g font-family="Inter,system-ui,sans-serif"><g stroke="#64748b" stroke-width="4"><path d="M500 270L280 430M500 270L720 430M280 430L170 610M280 430L390 610M720 430L610 610M720 430L830 610"/></g><g text-anchor="middle"><rect x="365" y="210" width="270" height="100" rx="22" fill="#1d4ed8"/><text x="500" y="252" fill="white" font-size="25" font-weight="700">V</text><text x="500" y="286" fill="#bfdbfe" font-size="20">β(G)=2</text><rect x="180" y="390" width="200" height="85" rx="20" fill="#0f766e"/><text x="280" y="425" fill="white" font-size="23" font-weight="700">S</text><text x="280" y="456" fill="#ccfbf1" font-size="18">β(G[S])=4</text><rect x="620" y="390" width="200" height="85" rx="20" fill="#7c3aed"/><text x="720" y="425" fill="white" font-size="23" font-weight="700">C</text><text x="720" y="456" fill="#ede9fe" font-size="18">β(G[C])=5</text><g font-size="21" fill="#e2e8f0"><circle cx="170" cy="610" r="55" fill="#334155"/><text x="170" y="618">A</text><circle cx="390" cy="610" r="55" fill="#334155"/><text x="390" y="618">B</text><circle cx="610" cy="610" r="55" fill="#334155"/><text x="610" y="618">D</text><circle cx="830" cy="610" r="55" fill="#334155"/><text x="830" y="618">{j}</text></g></g><g transform="translate(990 210)"><rect width="520" height="470" rx="26" fill="#132337" stroke="#334155"/><text x="30" y="58" fill="#e2e8f0" font-size="28" font-weight="700">核心定义与读法</text><text x="30" y="120" fill="#bae6fd" font-size="24">Strength</text><text x="30" y="160" fill="#f8fafc" font-size="23">β(G) = min<tspan baseline-shift="sub" font-size="16">Π:|Π|≥2</tspan> c(δ(Π))/(|Π|−1)</text><text x="30" y="225" fill="#bae6fd" font-size="24">Partition connectivity</text><text x="30" y="264" fill="#f8fafc" font-size="23">⌊β(G)⌋ = integral tree packing number</text><text x="30" y="329" fill="#bae6fd" font-size="24">Fractional arboricity</text><text x="30" y="368" fill="#f8fafc" font-size="23">max<tspan baseline-shift="sub" font-size="16">X⊆V, |X|≥2</tspan> c(E[X])/(|X|−1)</text><text x="30" y="428" fill="#c4b5fd" font-size="21">= hierarchy 最大内部标签</text></g><rect x="105" y="740" width="1390" height="78" rx="18" fill="#172554"/><text x="800" y="788" fill="#bfdbfe" font-size="22" text-anchor="middle">选择“最细”最优分割消除同值最优解的不唯一性；因此 hierarchy 是 canonical，而非任意递归切割树。</text></g></svg>
