<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Almost-linear canonical cut hierarchy algorithm</title><desc id="desc">The algorithm uses a tree-based flow network to recover a Lagrangian partition and recursively builds the hierarchy.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#60a5fa"/></marker></defs><rect width="1600" height="900" rx="30" fill="#091522"/><text x="80" y="86" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="700">从 max-flow 到完整层级：两层递归</text><text x="80" y="132" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="23">内层找到固定 λ 的最细 Lagrangian 最优分割；外层在 λ 区间二分并拼接层级</text><g font-family="Inter,system-ui,sans-serif"><g transform="translate(70 210)"><rect width="1460" height="250" rx="28" fill="#132337" stroke="#334155"/><text x="34" y="54" fill="#e2e8f0" font-size="27" font-weight="700">内层：Solve Φ<tspan baseline-shift="sub" font-size="18">G,λ</tspan>(Π)=c(δ(Π))−λ(|Π|−1)</text><g font-size="21" text-anchor="middle"><rect x="35" y="100" width="250" height="88" rx="18" fill="#1e3a8a"/><text x="160" y="135" fill="white">任意 spanning tree T</text><text x="160" y="166" fill="#bfdbfe">excess z<tspan baseline-shift="sub" font-size="14">Π*</tspan>(T)</text><rect x="385" y="100" width="250" height="88" rx="18" fill="#075985"/><text x="510" y="135" fill="white">构造 N(T)</text><text x="510" y="166" fill="#bae6fd">一次 max-flow</text><rect x="735" y="100" width="250" height="88" rx="18" fill="#0f766e"/><text x="860" y="135" fill="white">随机取两树之一</text><text x="860" y="166" fill="#ccfbf1">E[z(T′)] ≤ z(T)/2</text><rect x="1085" y="100" width="330" height="88" rx="18" fill="#6d28d9"/><text x="1250" y="135" fill="white">T respects Π*</text><text x="1250" y="166" fill="#ede9fe">min-cut 恢复最优分割</text></g><g stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"><path d="M295 144h75"/><path d="M645 144h75"/><path d="M995 144h75"/></g></g><g transform="translate(70 515)"><rect width="1460" height="260" rx="28" fill="#132337" stroke="#334155"/><text x="34" y="54" fill="#e2e8f0" font-size="27" font-weight="700">外层：BuildHierarchy(H, ℓ, u)</text><g font-size="20"><rect x="35" y="100" width="225" height="96" rx="18" fill="#1e3a8a"/><text x="147" y="138" fill="white" text-anchor="middle">t=(ℓ+u)/2</text><text x="147" y="170" fill="#bfdbfe" text-anchor="middle">求 Π<tspan baseline-shift="sub" font-size="14">H</tspan>(t)</text><rect x="355" y="100" width="280" height="96" rx="18" fill="#075985"/><text x="495" y="138" fill="white" text-anchor="middle">λ ≤ t：只能合并</text><text x="495" y="170" fill="#bae6fd" text-anchor="middle">递归 H/Π, [ℓ,t]</text><rect x="730" y="100" width="280" height="96" rx="18" fill="#0f766e"/><text x="870" y="138" fill="white" text-anchor="middle">λ ≥ t：只能细分</text><text x="870" y="170" fill="#ccfbf1" text-anchor="middle">递归 H[B], [t,u]</text><rect x="1105" y="100" width="310" height="96" rx="18" fill="#6d28d9"/><text x="1260" y="138" fill="white" text-anchor="middle">叶替换拼接</text><text x="1260" y="170" fill="#ede9fe" text-anchor="middle">返回 canonical hierarchy</text></g><g stroke="#60a5fa" stroke-width="4" marker-end="url(#a)"><path d="M270 148h70"/><path d="M645 148h70"/><path d="M1020 148h70"/></g></g><text x="800" y="834" fill="#94a3b8" font-size="20" text-anchor="middle">每层所有子问题的边数总和 ≤ m；深度 O(log((W+1)(n−1)²))；多项式有界容量下期望时间 (m+n)¹⁺ᵒ⁽¹⁾</text></g></svg>
