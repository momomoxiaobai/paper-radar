<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="920"
  viewBox="0 0 1600 920"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Chronos-2 通用基准与科学案例结果</title>
  <desc id="desc">
    展示 fev-bench
    相对最强时间序列基座模型的增益，以及水文、层级预测、校准和速度结果。
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071424" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
  </defs>
  <rect width="1600" height="920" rx="36" fill="url(#bg)" />
  <text
    x="88"
    y="90"
    fill="#f8fafc"
    font-family="Inter, PingFang SC, sans-serif"
    font-size="42"
    font-weight="700"
  >
    Chronos-2：小参数量，但证据覆盖基准、校准与科学任务
  </text>
  <text
    x="88"
    y="138"
    fill="#94a3b8"
    font-family="Inter, PingFang SC, sans-serif"
    font-size="21"
  >
    根据论文 Figures 3、7、8 与 Appendix A.7 重绘
  </text>
  <g font-family="Inter, PingFang SC, sans-serif">
    <rect
      x="90"
      y="200"
      width="700"
      height="275"
      rx="28"
      fill="#0e233e"
      stroke="#38bdf8"
    />
    <text x="135" y="255" fill="#7dd3fc" font-size="24" font-weight="700">
      fev-bench：相对最强 TSFM
    </text>
    <text x="135" y="325" fill="#ffffff" font-size="48" font-weight="700">
      +5.2 pp
    </text>
    <text x="405" y="325" fill="#cbd5e1" font-size="20">MASE skill score</text>
    <text x="135" y="390" fill="#ffffff" font-size="48" font-weight="700">
      +9.0 pp
    </text>
    <text x="405" y="390" fill="#cbd5e1" font-size="20">MASE win rate</text>
    <text x="135" y="438" fill="#67e8f9" font-size="18">
      开启 ICL 本身贡献 +4.1 pp skill score
    </text>

    <rect
      x="830"
      y="200"
      width="680"
      height="275"
      rx="28"
      fill="#171d42"
      stroke="#818cf8"
    />
    <text x="875" y="255" fill="#c4b5fd" font-size="24" font-weight="700">
      概率校准与吞吐
    </text>
    <text x="875" y="330" fill="#ffffff" font-size="48" font-weight="700">
      23 / 24
    </text>
    <text x="1110" y="330" fill="#cbd5e1" font-size="20">校准组合最佳</text>
    <text x="875" y="395" fill="#ffffff" font-size="48" font-weight="700">
      0.8 s
    </text>
    <text x="1055" y="395" fill="#cbd5e1" font-size="20">
      A10G / 100 条序列
    </text>
    <text x="875" y="438" fill="#c4b5fd" font-size="18">
      120M 参数，可在普通 CPU 上推理
    </text>

    <rect
      x="90"
      y="520"
      width="450"
      height="260"
      rx="28"
      fill="#10283b"
      stroke="#0ea5e9"
    />
    <text x="130" y="575" fill="#7dd3fc" font-size="23" font-weight="700">
      水文：Median NSE
    </text>
    <text x="130" y="642" fill="#94a3b8" font-size="20">单变量</text>
    <text x="330" y="642" fill="#fff" font-size="31" font-weight="700">
      0.15
    </text>
    <text x="130" y="698" fill="#bae6fd" font-size="20">+ 气象协变量 ICL</text>
    <text x="330" y="698" fill="#67e8f9" font-size="31" font-weight="700">
      0.68
    </text>
    <text x="130" y="750" fill="#94a3b8" font-size="17">
      微调后匹配专用 LSTM ensemble
    </text>

    <rect
      x="575"
      y="520"
      width="450"
      height="260"
      rx="28"
      fill="#151f42"
      stroke="#6366f1"
    />
    <text x="615" y="575" fill="#a5b4fc" font-size="23" font-weight="700">
      层级预测：coherence error
    </text>
    <text x="615" y="642" fill="#cbd5e1" font-size="20">Tourism-Q</text>
    <text x="820" y="642" fill="#fff" font-size="29" font-weight="700">
      3.8% → 2.0%
    </text>
    <text x="615" y="698" fill="#cbd5e1" font-size="20">Tourism-M</text>
    <text x="820" y="698" fill="#fff" font-size="29" font-weight="700">
      15.2% → 4.4%
    </text>
    <text x="615" y="750" fill="#c4b5fd" font-size="17">
      未显式提供 hierarchy，group attention 隐式学习
    </text>

    <rect
      x="1060"
      y="520"
      width="450"
      height="260"
      rx="28"
      fill="#18223b"
      stroke="#a78bfa"
    />
    <text x="1100" y="575" fill="#c4b5fd" font-size="23" font-weight="700">
      关键消融：fev-bench SQL
    </text>
    <text x="1100" y="642" fill="#cbd5e1" font-size="20">
      Reference Stage-1
    </text>
    <text x="1370" y="642" fill="#fff" font-size="29" font-weight="700">
      0.469
    </text>
    <text x="1100" y="698" fill="#cbd5e1" font-size="20">
      No group attention
    </text>
    <text x="1370" y="698" fill="#f0abfc" font-size="29" font-weight="700">
      0.436
    </text>
    <text x="1100" y="750" fill="#ddd6fe" font-size="17">
      只用真实数据也明显退化：0.419
    </text>
  </g>
  <text
    x="90"
    y="855"
    fill="#94a3b8"
    font-family="Inter, PingFang SC, sans-serif"
    font-size="19"
  >
    结论应分层阅读：零样本已很强，但水文最优结果来自任务微调，而非纯零样本。
  </text>
</svg>
