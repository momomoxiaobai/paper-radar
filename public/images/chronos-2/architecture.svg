<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1700"
  height="920"
  viewBox="0 0 1700 920"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Chronos-2 多变量时间序列预测架构</title>
  <desc id="desc">
    目标与协变量经过缩放、元特征和 patch embedding，Transformer
    交替执行时间注意力与组注意力，最后由分位数头输出概率预测。
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071424" />
      <stop offset="1" stop-color="#12335a" />
    </linearGradient>
    <linearGradient id="attn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10z" fill="#94a3b8" />
    </marker>
    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="12"
        flood-color="#020617"
        flood-opacity="0.55"
      />
    </filter>
  </defs>
  <rect width="1700" height="920" rx="36" fill="url(#bg)" />
  <text
    x="88"
    y="90"
    fill="#f8fafc"
    font-family="Inter, PingFang SC, sans-serif"
    font-size="43"
    font-weight="700"
  >
    Chronos-2：时间维建模 + 组内跨序列推断
  </text>
  <text
    x="88"
    y="140"
    fill="#94a3b8"
    font-family="Inter, PingFang SC, sans-serif"
    font-size="21"
  >
    根据论文 Figure 1 重绘
  </text>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, sans-serif">
    <rect
      x="80"
      y="220"
      width="330"
      height="430"
      rx="28"
      fill="#0f243c"
      stroke="#38bdf8"
      stroke-width="2"
    />
    <text x="125" y="275" fill="#7dd3fc" font-size="25" font-weight="700">
      输入组
    </text>
    <text x="125" y="323" fill="#e2e8f0" font-size="20">Target #1</text>
    <polyline
      points="125,365 165,345 205,380 245,320 285,350 325,295 365,330"
      fill="none"
      stroke="#22d3ee"
      stroke-width="4"
    />
    <text x="125" y="430" fill="#e2e8f0" font-size="20">Target #2</text>
    <polyline
      points="125,472 165,455 205,450 245,420 285,448 325,405 365,430"
      fill="none"
      stroke="#818cf8"
      stroke-width="4"
    />
    <text x="125" y="535" fill="#e2e8f0" font-size="20">Known Covariate</text>
    <polyline
      points="125,575 165,575 205,530 245,530 285,585 325,585 365,515"
      fill="none"
      stroke="#fbbf24"
      stroke-width="4"
    />
    <text x="125" y="622" fill="#94a3b8" font-size="17">
      未来已知值可直接进入 horizon
    </text>

    <line
      x1="410"
      y1="435"
      x2="495"
      y2="435"
      stroke="#94a3b8"
      stroke-width="4"
      marker-end="url(#arrow)"
    />
    <rect
      x="510"
      y="245"
      width="310"
      height="380"
      rx="28"
      fill="#11293f"
      stroke="#0ea5e9"
    />
    <text x="555" y="300" fill="#7dd3fc" font-size="25" font-weight="700">
      统一 Tokenization
    </text>
    <rect x="555" y="345" width="220" height="54" rx="16" fill="#173a55" />
    <text x="665" y="379" text-anchor="middle" fill="#e0f2fe" font-size="19">
      历史统计量缩放
    </text>
    <rect x="555" y="425" width="220" height="54" rx="16" fill="#173a55" />
    <text x="665" y="459" text-anchor="middle" fill="#e0f2fe" font-size="19">
      时间索引 + 缺失 mask
    </text>
    <rect x="555" y="505" width="220" height="54" rx="16" fill="#173a55" />
    <text x="665" y="539" text-anchor="middle" fill="#e0f2fe" font-size="19">
      Patch Embedding
    </text>
    <text x="555" y="599" fill="#94a3b8" font-size="17">最长 8192 历史步</text>

    <line
      x1="820"
      y1="435"
      x2="905"
      y2="435"
      stroke="#94a3b8"
      stroke-width="4"
      marker-end="url(#arrow)"
    />
    <rect
      x="920"
      y="205"
      width="390"
      height="460"
      rx="30"
      fill="#171f43"
      stroke="#818cf8"
      stroke-width="2"
    />
    <text x="965" y="265" fill="#c4b5fd" font-size="25" font-weight="700">
      Transformer Stack × N
    </text>
    <rect x="970" y="315" width="290" height="95" rx="22" fill="#123652" />
    <text
      x="1115"
      y="352"
      text-anchor="middle"
      fill="#7dd3fc"
      font-size="22"
      font-weight="700"
    >
      Time Attention
    </text>
    <text x="1115" y="385" text-anchor="middle" fill="#bae6fd" font-size="17">
      同一序列跨时间 patch
    </text>
    <text x="1115" y="449" text-anchor="middle" fill="#a78bfa" font-size="34">
      ↕
    </text>
    <rect x="970" y="480" width="290" height="105" rx="22" fill="url(#attn)" />
    <text
      x="1115"
      y="520"
      text-anchor="middle"
      fill="#fff"
      font-size="22"
      font-weight="700"
    >
      Group Attention
    </text>
    <text x="1115" y="553" text-anchor="middle" fill="#eef2ff" font-size="17">
      相同 patch 上跨目标/协变量
    </text>
    <text x="965" y="632" fill="#c4b5fd" font-size="17">
      改变 group assignment 即切换任务模式
    </text>

    <line
      x1="1310"
      y1="435"
      x2="1390"
      y2="435"
      stroke="#94a3b8"
      stroke-width="4"
      marker-end="url(#arrow)"
    />
    <rect
      x="1405"
      y="250"
      width="220"
      height="370"
      rx="28"
      fill="#18233d"
      stroke="#a78bfa"
    />
    <text
      x="1515"
      y="307"
      text-anchor="middle"
      fill="#ddd6fe"
      font-size="24"
      font-weight="700"
    >
      Quantile Head
    </text>
    <text x="1515" y="354" text-anchor="middle" fill="#cbd5e1" font-size="18">
      一次输出最多
    </text>
    <text
      x="1515"
      y="392"
      text-anchor="middle"
      fill="#fff"
      font-size="32"
      font-weight="700"
    >
      1024
    </text>
    <text x="1515" y="422" text-anchor="middle" fill="#cbd5e1" font-size="18">
      未来时间步
    </text>
    <rect x="1450" y="474" width="130" height="20" rx="10" fill="#334155" />
    <rect x="1450" y="474" width="20" height="20" rx="10" fill="#38bdf8" />
    <rect x="1450" y="514" width="130" height="20" rx="10" fill="#334155" />
    <rect x="1450" y="514" width="65" height="20" rx="10" fill="#818cf8" />
    <rect x="1450" y="554" width="130" height="20" rx="10" fill="#334155" />
    <rect x="1450" y="554" width="118" height="20" rx="10" fill="#c084fc" />
    <text x="1515" y="605" text-anchor="middle" fill="#c4b5fd" font-size="17">
      q = 0.01 ... 0.99
    </text>
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect
      x="120"
      y="730"
      width="1460"
      height="105"
      rx="24"
      fill="#0d2238"
      stroke="#334155"
    />
    <text x="170" y="774" fill="#f8fafc" font-size="22" font-weight="700">
      推理时学习的不是新权重，而是当前 group 内的关系：
    </text>
    <text x="170" y="813" fill="#93c5fd" font-size="20">
      哪些目标一起变化？哪些协变量领先？哪些序列可为短历史目标提供上下文？
    </text>
  </g>
</svg>
