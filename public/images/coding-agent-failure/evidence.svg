<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Evidence that coding-agent failure predictors mostly learn issue and model</title><desc id="desc">Comparison of pooled and within-issue AUROC, routing gains, and variance components.</desc><rect width="1600" height="900" rx="30" fill="#0b1320"/><text x="80" y="86" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="700">高 pooled AUROC，不代表读懂了这一次运行</text><text x="80" y="132" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="23">2,840 条 step-20 轨迹；D<tspan baseline-shift="sub" font-size="16">ext</tspan> 来自 16 个外部模型的任务失败率</text><g font-family="Inter,system-ui,sans-serif"><g transform="translate(75 205)"><rect width="900" height="470" rx="26" fill="#152033"/><text x="35" y="55" fill="#e2e8f0" font-size="27" font-weight="700">AUROC：换一个比较单位，结论就变了</text><line x1="250" y1="110" x2="250" y2="420" stroke="#475569"/><line x1="250" y1="420" x2="850" y2="420" stroke="#475569"/><g font-size="19" fill="#cbd5e1"><text x="230" y="160" text-anchor="end">Issue difficulty</text><text x="230" y="225" text-anchor="end">D<tspan baseline-shift="sub" font-size="14">ext</tspan> + Model</text><text x="230" y="290" text-anchor="end">TF-IDF R8</text><text x="230" y="355" text-anchor="end">TF-IDF ALL</text></g><g><rect x="250" y="130" width="554" height="34" rx="8" fill="#f97316"/><rect x="250" y="195" width="557" height="34" rx="8" fill="#a78bfa"/><rect x="250" y="260" width="374" height="34" rx="8" fill="#38bdf8"/><rect x="250" y="325" width="378" height="34" rx="8" fill="#38bdf8"/></g><g fill="#f8fafc" font-size="19" font-weight="700"><text x="816" y="154">0.924 pooled / 0.500 within</text><text x="819" y="219">0.929 pooled / 0.718 within</text><text x="636" y="284">0.624 pooled / 0.604 within</text><text x="640" y="349">0.630 pooled / 0.610 within</text></g><text x="550" y="458" fill="#94a3b8" font-size="18" text-anchor="middle">99.66% 的 failed–success pairs 来自不同 issue</text></g><g transform="translate(1020 205)"><rect width="505" height="470" rx="26" fill="#152033"/><text x="30" y="55" fill="#e2e8f0" font-size="27" font-weight="700">闭环动作真正得到什么？</text><g font-size="21"><text x="30" y="120" fill="#cbd5e1">Oracle gap（7 模型）</text><text x="465" y="120" fill="#f8fafc" text-anchor="end">10.0 pp</text><text x="30" y="170" fill="#cbd5e1">按历史为 issue 选模型</text><text x="465" y="170" fill="#f8fafc" text-anchor="end">+0.09 pp</text><text x="30" y="220" fill="#cbd5e1">新 issue router</text><text x="465" y="220" fill="#f8fafc" text-anchor="end">+0.41 pp</text><text x="30" y="270" fill="#cbd5e1">失败后固定模型 escalation</text><text x="465" y="270" fill="#5eead4" text-anchor="end">+6.91 pp</text></g><line x1="30" y1="310" x2="475" y2="310" stroke="#334155"/><text x="30" y="352" fill="#cbd5e1" font-size="20">重复运行的 outcome variance</text><text x="30" y="392" fill="#fb923c" font-size="20">Issue 53%</text><text x="177" y="392" fill="#a78bfa" font-size="20">Specialization 4.6%</text><text x="385" y="392" fill="#2dd4bf" font-size="20">Run 42%</text><text x="30" y="438" fill="#94a3b8" font-size="17">第二次尝试有效，不等于模型路由有效。</text></g><rect x="95" y="724" width="1410" height="91" rx="20" fill="#3f1d2e" stroke="#be123c"/><text x="800" y="763" fill="#fecdd3" font-size="22" text-anchor="middle">等价性检验：trajectory score 加到 D<tspan baseline-shift="sub" font-size="15">ext</tspan> + M 后，AUROC 增益与 0 等价；这不是“显著性不足”，而是预设 ±0.02 区间内等价。</text><text x="800" y="798" fill="#fda4af" font-size="18" text-anchor="middle">证据边界：主要来自一个 benchmark/scaffold；不拒绝 no-specialization 不能证明专长不存在。</text></g></svg>
