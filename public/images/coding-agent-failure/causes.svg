<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three causes of coding-agent failure</title><desc id="desc">Issue difficulty, model ability, and run variation require different operational actions.</desc>
  <rect width="1600" height="900" rx="30" fill="#0b1320"/>
  <text x="80" y="88" fill="#f8fafc" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="700">同一个“失败告警”，可能对应三种完全不同的动作</text>
  <text x="80" y="136" fill="#94a3b8" font-family="Inter,system-ui,sans-serif" font-size="23">论文借用 item response theory：结果由题目难度、模型能力与单次运行随机性共同决定</text>
  <g font-family="Inter,system-ui,sans-serif">
    <g transform="translate(70 230)"><rect width="450" height="430" rx="28" fill="#172033" stroke="#f97316" stroke-width="3"/><circle cx="225" cy="104" r="64" fill="#7c2d12"/><text x="225" y="117" fill="#fed7aa" font-size="43" text-anchor="middle">D</text><text x="225" y="205" fill="#fff7ed" font-size="31" font-weight="700" text-anchor="middle">Hard issue</text><text x="225" y="250" fill="#cbd5e1" font-size="21" text-anchor="middle">多数模型都会失败</text><line x1="70" y1="290" x2="380" y2="290" stroke="#334155"/><text x="225" y="340" fill="#fdba74" font-size="23" text-anchor="middle">动作：停止 / 人工介入</text><text x="225" y="382" fill="#94a3b8" font-size="18" text-anchor="middle">盲目 retry 成功率仍低</text></g>
    <g transform="translate(575 230)"><rect width="450" height="430" rx="28" fill="#172033" stroke="#a78bfa" stroke-width="3"/><circle cx="225" cy="104" r="64" fill="#4c1d95"/><text x="225" y="117" fill="#ddd6fe" font-size="43" text-anchor="middle">M</text><text x="225" y="205" fill="#f5f3ff" font-size="31" font-weight="700" text-anchor="middle">Weak model</text><text x="225" y="250" fill="#cbd5e1" font-size="21" text-anchor="middle">该模型整体能力不足</text><line x1="70" y1="290" x2="380" y2="290" stroke="#334155"/><text x="225" y="340" fill="#c4b5fd" font-size="23" text-anchor="middle">动作：切换更强模型</text><text x="225" y="382" fill="#94a3b8" font-size="18" text-anchor="middle">但须先证明存在可泛化的专长</text></g>
    <g transform="translate(1080 230)"><rect width="450" height="430" rx="28" fill="#172033" stroke="#2dd4bf" stroke-width="3"/><circle cx="225" cy="104" r="64" fill="#115e59"/><text x="225" y="117" fill="#ccfbf1" font-size="43" text-anchor="middle">R</text><text x="225" y="205" fill="#f0fdfa" font-size="31" font-weight="700" text-anchor="middle">Bad run</text><text x="225" y="250" fill="#cbd5e1" font-size="21" text-anchor="middle">同模型重跑可成功</text><line x1="70" y1="290" x2="380" y2="290" stroke="#334155"/><text x="225" y="340" fill="#5eead4" font-size="23" text-anchor="middle">动作：retry 当前模型</text><text x="225" y="382" fill="#94a3b8" font-size="18" text-anchor="middle">需要 repeated-run 证据</text></g>
    <rect x="142" y="724" width="1316" height="92" rx="20" fill="#172554"/><text x="800" y="762" fill="#bfdbfe" font-size="23" text-anchor="middle">Rasch：P(Y<tspan baseline-shift="sub" font-size="16">im</tspan>=1)=σ(θ<tspan baseline-shift="sub" font-size="16">m</tspan>−b<tspan baseline-shift="sub" font-size="16">i</tspan>)　|　2PL：P(Y<tspan baseline-shift="sub" font-size="16">im</tspan>=1)=σ(a<tspan baseline-shift="sub" font-size="16">i</tspan>(θ<tspan baseline-shift="sub" font-size="16">m</tspan>−b<tspan baseline-shift="sub" font-size="16">i</tspan>))</text><text x="800" y="798" fill="#94a3b8" font-size="18" text-anchor="middle">单次公开榜单每个模型×任务只有一次尝试，无法从观测结果中识别 R</text></g>
</svg>
