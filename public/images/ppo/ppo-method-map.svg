<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">PPO 方法全景：从策略梯度到 RLHF</title>
  <desc id="desc">展示策略梯度、TRPO、PPO Clip、GAE、actor critic 训练循环与 RLHF 之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker>
    <style>
      .title{font:700 46px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#0f172a}.subtitle{font:400 23px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#475569}.h{font:700 28px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#0f172a}.p{font:400 21px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#334155}.small{font:500 18px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#475569}.mono{font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1e293b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eef2ff;stroke:#818cf8;stroke-width:3}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:3}.orange{fill:#fff7ed;stroke:#fb923c;stroke-width:3}.violet{fill:#faf5ff;stroke:#c084fc;stroke-width:3}.line{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1050" rx="36" fill="url(#bg)"/>
  <text x="90" y="88" class="title">PPO 不是一个 clip 公式，而是一套稳定更新系统</text>
  <text x="90" y="130" class="subtitle">策略梯度给方向，TRPO 提出“别走太远”，PPO 用一阶优化近似实现，再由 GAE、critic 和工程细节把它变成可训练算法。</text>

  <rect x="85" y="210" width="335" height="225" rx="28" class="box" filter="url(#shadow)"/>
  <text x="120" y="260" class="h">1. 策略梯度</text>
  <text x="120" y="305" class="mono">log πθ(a|s) · Â</text>
  <text x="120" y="350" class="p">Â &gt; 0：提高动作概率</text>
  <text x="120" y="385" class="p">Â &lt; 0：降低动作概率</text>
  <text x="120" y="418" class="small">问题：同一批数据多更新会走得过远</text>

  <rect x="525" y="210" width="335" height="225" rx="28" class="orange" filter="url(#shadow)"/>
  <text x="560" y="260" class="h">2. TRPO</text>
  <text x="560" y="305" class="mono">max surrogate</text>
  <text x="560" y="340" class="mono">s.t. mean KL ≤ δ</text>
  <text x="560" y="385" class="p">明确限制新旧策略距离</text>
  <text x="560" y="418" class="small">代价：Fisher/Hessian-vector、共轭梯度、线搜索</text>

  <rect x="965" y="210" width="350" height="225" rx="28" class="accent" filter="url(#shadow)"/>
  <text x="1000" y="260" class="h">3. PPO-Clip</text>
  <text x="1000" y="305" class="mono">r = πθ / πold</text>
  <text x="1000" y="340" class="mono">min(rÂ, clip(r)Â)</text>
  <text x="1000" y="385" class="p">只截断“让目标继续变好”的过度更新</text>
  <text x="1000" y="418" class="small">一阶 Adam + 多 epoch minibatch</text>

  <rect x="1420" y="210" width="295" height="225" rx="28" class="green" filter="url(#shadow)"/>
  <text x="1455" y="260" class="h">4. GAE + Critic</text>
  <text x="1455" y="305" class="mono">Â = Σ(γλ)ˡδ</text>
  <text x="1455" y="350" class="p">critic 降低方差</text>
  <text x="1455" y="385" class="p">λ 调节偏差—方差</text>
  <text x="1455" y="418" class="small">还要正确处理 bootstrap</text>

  <path d="M420 322H515" class="line"/><path d="M860 322H955" class="line"/><path d="M1315 322H1410" class="line"/>

  <rect x="130" y="560" width="1050" height="340" rx="30" class="box" filter="url(#shadow)"/>
  <text x="175" y="620" class="h">Actor–Critic 训练闭环</text>
  <rect x="180" y="675" width="190" height="110" rx="20" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="215" y="724" class="p">冻结 πold</text><text x="215" y="758" class="small">采集 rollout</text>
  <rect x="430" y="675" width="210" height="110" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="466" y="724" class="p">计算 return</text><text x="466" y="758" class="small">GAE / normalize</text>
  <rect x="700" y="675" width="200" height="110" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="737" y="724" class="p">多轮更新</text><text x="737" y="758" class="small">actor + critic</text>
  <rect x="960" y="675" width="170" height="110" rx="20" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <text x="993" y="724" class="p">诊断</text><text x="983" y="758" class="small">KL / clipfrac</text>
  <path d="M370 730H420M640 730H690M900 730H950" class="line"/>
  <path d="M1045 795C1045 850 275 850 275 795" class="line"/>
  <text x="180" y="855" class="small">每轮结束后丢弃旧 rollout，重新用最新策略采样——这仍是 on-policy 方法。</text>

  <rect x="1260" y="560" width="430" height="340" rx="30" class="violet" filter="url(#shadow)"/>
  <text x="1305" y="620" class="h">映射到大模型 RLHF</text>
  <text x="1305" y="680" class="p">状态：prompt + 已生成前缀</text>
  <text x="1305" y="725" class="p">动作：下一个 token</text>
  <text x="1305" y="770" class="p">终局奖励：Reward Model / verifier</text>
  <text x="1305" y="815" class="p">局部约束：对 reference 的 token KL</text>
  <text x="1305" y="860" class="small">ratio clipping 与 reference KL 不是同一件事</text>

  <text x="90" y="995" class="small">阅读顺序：先理解 advantage 与 importance ratio，再看 clip 的分段几何；最后才讨论超参数和 RLHF。</text>
</svg>
