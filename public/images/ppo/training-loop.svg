<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">PPO 从采样到更新的完整训练循环</title>
  <desc id="desc">展示采集 on-policy rollout、计算 GAE、minibatch 多轮优化、诊断与重新采样，以及常见实现细节。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker>
    <style>
      .title{font:700 46px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#0f172a}.sub{font:400 23px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#475569}.h{font:700 27px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#0f172a}.p{font:400 20px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#334155}.small{font:500 17px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#475569}.num{font:800 28px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#fff}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.line{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arrow)}.chip{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1800" height="1050" rx="36" fill="url(#bg)"/>
  <text x="85" y="85" class="title">一次 PPO iteration：数据只“保鲜”几轮 minibatch</text>
  <text x="85" y="128" class="sub">旧策略只负责采样；当前策略在固定 rollout 上做 K 个 epoch；随后必须丢弃数据并重新采样。</text>

  <rect x="80" y="210" width="300" height="280" rx="28" class="box" filter="url(#shadow)"/>
  <circle cx="125" cy="255" r="25" fill="#4f46e5"/><text x="117" y="265" class="num">1</text>
  <text x="165" y="265" class="h">冻结旧策略</text>
  <text x="115" y="320" class="p">保存 log πold(a|s)</text><text x="115" y="357" class="p">保存 Vold(s)</text>
  <rect x="115" y="400" width="230" height="50" rx="16" class="chip"/><text x="140" y="432" class="small">不要边采样边更新</text>

  <rect x="440" y="210" width="300" height="280" rx="28" class="box" filter="url(#shadow)"/>
  <circle cx="485" cy="255" r="25" fill="#0ea5e9"/><text x="477" y="265" class="num">2</text>
  <text x="525" y="265" class="h">并行采样</text>
  <text x="475" y="320" class="p">N 个环境 × T 步</text><text x="475" y="357" class="p">记录 s, a, r, done</text>
  <rect x="475" y="400" width="230" height="50" rx="16" class="chip"/><text x="497" y="432" class="small">区分 terminated / truncated</text>

  <rect x="800" y="210" width="300" height="280" rx="28" class="box" filter="url(#shadow)"/>
  <circle cx="845" cy="255" r="25" fill="#10b981"/><text x="837" y="265" class="num">3</text>
  <text x="885" y="265" class="h">GAE 与 return</text>
  <text x="835" y="320" class="p">δ = r + γV′ − V</text><text x="835" y="357" class="p">Â = δ + γλÂ′</text>
  <rect x="835" y="400" width="230" height="50" rx="16" class="chip"/><text x="868" y="432" class="small">按 batch 标准化优势</text>

  <rect x="1160" y="210" width="300" height="280" rx="28" class="box" filter="url(#shadow)"/>
  <circle cx="1205" cy="255" r="25" fill="#f97316"/><text x="1197" y="265" class="num">4</text>
  <text x="1245" y="265" class="h">K 个优化 epoch</text>
  <text x="1195" y="320" class="p">shuffle → minibatch</text><text x="1195" y="357" class="p">actor + critic + entropy</text>
  <rect x="1195" y="400" width="230" height="50" rx="16" class="chip"/><text x="1224" y="432" class="small">梯度裁剪 / LR 退火</text>

  <rect x="1520" y="210" width="200" height="280" rx="28" class="box" filter="url(#shadow)"/>
  <circle cx="1565" cy="255" r="25" fill="#a855f7"/><text x="1557" y="265" class="num">5</text>
  <text x="1605" y="265" class="h">诊断</text>
  <text x="1555" y="320" class="p">approx KL</text><text x="1555" y="357" class="p">clip fraction</text><text x="1555" y="394" class="p">entropy</text><text x="1555" y="431" class="p">explained var</text>

  <path d="M380 350H430M740 350H790M1100 350H1150M1460 350H1510" class="line"/>
  <path d="M1620 500C1620 565 230 565 230 500" class="line"/>

  <rect x="85" y="650" width="770" height="305" rx="28" fill="#fff" stroke="#818cf8" stroke-width="3"/>
  <text x="130" y="710" class="h">真正决定复现结果的实现细节</text>
  <text x="130" y="765" class="p">• observation / reward normalization 与 reward clipping</text>
  <text x="130" y="805" class="p">• orthogonal init、Adam ε、线性 learning-rate annealing</text>
  <text x="130" y="845" class="p">• value loss 是否 clip；共享/独立 actor-critic 网络</text>
  <text x="130" y="885" class="p">• 连续动作的 Gaussian 参数化、action clipping 与 log-prob 一致性</text>
  <text x="130" y="925" class="p">• time-limit truncation 是否 bootstrap；RNN 隐状态是否正确重置</text>

  <rect x="945" y="650" width="770" height="305" rx="28" fill="#fff" stroke="#f97316" stroke-width="3"/>
  <text x="990" y="710" class="h">四个必须持续监控的信号</text>
  <text x="990" y="765" class="p">approx KL 太大：即使 clip 了，整批策略仍可能漂得太远</text>
  <text x="990" y="805" class="p">clip fraction 太高：大量样本进入平台，额外 epoch 利用率下降</text>
  <text x="990" y="845" class="p">entropy 塌缩：探索或生成多样性过早消失</text>
  <text x="990" y="885" class="p">value error / explained variance 恶化：优势符号可能开始不可靠</text>
  <text x="990" y="925" class="p">实践中可用 target-KL 提前终止当前 policy update</text>

  <text x="85" y="1010" class="small">PPO 的“样本复用”只发生在一个短暂的 update window 内；K 越大，数据相对当前策略越 off-policy。</text>
</svg>
