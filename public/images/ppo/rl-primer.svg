<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">强化学习入门：Agent 与环境的交互循环</title>
  <desc id="desc">展示环境给状态、Agent 用策略选择动作、环境返回奖励和下一状态，以及 actor、critic 和 PPO 的分工。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".11"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#64748b"/></marker>
    <style>.title{font:700 46px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#0f172a}.sub{font:400 23px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#475569}.h{font:700 30px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#0f172a}.p{font:400 21px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#334155}.small{font:500 18px system-ui,-apple-system,"Noto Sans SC",sans-serif;fill:#475569}.mono{font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#312e81}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.line{stroke:#64748b;stroke-width:5;fill:none;marker-end:url(#arrow)}.dash{stroke:#818cf8;stroke-width:4;stroke-dasharray:12 10;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1800" height="1050" rx="36" fill="url(#bg)"/>
  <text x="90" y="88" class="title">强化学习：没有逐步标准答案，只有行动后的结果</text>
  <text x="90" y="132" class="sub">Agent 通过反复交互收集 trajectory；Policy 决定动作，Critic 预测未来，PPO 负责稳定地更新 Policy。</text>

  <rect x="115" y="255" width="540" height="390" rx="36" fill="#eef2ff" stroke="#818cf8" stroke-width="3" filter="url(#shadow)"/>
  <text x="165" y="320" class="h">Agent</text>
  <rect x="165" y="365" width="440" height="105" rx="22" class="box"/>
  <text x="205" y="410" class="p">Actor / Policy πθ(a|s)</text><text x="205" y="445" class="small">看到状态后产生动作分布</text>
  <rect x="165" y="505" width="440" height="105" rx="22" class="box"/>
  <text x="205" y="550" class="p">Critic / Value Vφ(s)</text><text x="205" y="585" class="small">预测从当前状态还能得到多少回报</text>

  <rect x="1145" y="255" width="540" height="390" rx="36" fill="#ecfdf5" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
  <text x="1195" y="320" class="h">Environment</text>
  <text x="1195" y="390" class="p">模拟器、游戏、机器人、工具环境</text>
  <text x="1195" y="445" class="p">根据 (s(t), a(t)) 产生：</text>
  <rect x="1195" y="485" width="195" height="80" rx="20" class="box"/><text x="1240" y="535" class="mono">reward r(t)</text>
  <rect x="1430" y="485" width="205" height="80" rx="20" class="box"/><text x="1455" y="535" class="mono">state s(t+1)</text>
  <text x="1195" y="605" class="small">环境定义“什么是好”，Agent 学习“怎样行动”</text>

  <path d="M655 360C820 230 980 230 1145 360" class="line"/>
  <text x="825" y="258" class="p">动作 a(t)</text>
  <path d="M1145 575C980 760 820 760 655 575" class="line"/>
  <text x="790" y="750" class="p">奖励 r(t)、下一状态 s(t+1)</text>

  <rect x="460" y="835" width="880" height="125" rx="28" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
  <text x="505" y="885" class="h">PPO 的位置</text>
  <text x="505" y="925" class="p">用 rollout 中“哪些动作比预期好”的证据更新 Actor，同时限制新策略不要一步离旧策略太远。</text>
  <path d="M730 835C650 735 610 690 530 620" class="dash"/>
  <text x="90" y="1015" class="small">trajectory τ = (s₀,a₀,r₀,s₁,a₁,r₁,...)；episode 是一条有终点的 trajectory。</text>
</svg>
