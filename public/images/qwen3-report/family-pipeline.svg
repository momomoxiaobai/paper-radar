<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3 模型家族与训练流水线</title>
  <desc id="desc">展示六个 dense、两个 MoE 模型，三阶段预训练、四阶段旗舰后训练和轻量模型蒸馏。</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="82" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#0f172a">Qwen3 不是单一 checkpoint，而是一套 Dense / MoE × 双模式训练配方</text>
  <text x="80" y="128" font-family="system-ui,sans-serif" font-size="24" fill="#475569">报告日期 2025-05-15；36T tokens、119 语言与方言、Apache 2.0</text>
  <g font-family="system-ui,sans-serif">
    <rect x="80" y="185" width="470" height="205" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    <text x="115" y="235" font-size="30" font-weight="700" fill="#1e40af">Dense family</text>
    <text x="115" y="285" font-size="24" fill="#1e3a8a">0.6B · 1.7B · 4B · 8B · 14B · 32B</text>
    <text x="115" y="330" font-size="21" fill="#334155">GQA · SwiGLU · RoPE · RMSNorm</text>
    <text x="115" y="365" font-size="21" fill="#334155">移除 QKV bias，引入 QK-Norm</text>
    <rect x="600" y="185" width="470" height="205" rx="24" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <text x="635" y="235" font-size="30" font-weight="700" fill="#5b21b6">MoE family</text>
    <text x="635" y="285" font-size="24" fill="#4c1d95">30B-A3B · 235B-A22B</text>
    <text x="635" y="330" font-size="21" fill="#334155">128 experts / token 激活 8 个</text>
    <text x="635" y="365" font-size="21" fill="#334155">无 shared expert；global-batch load balance</text>
    <rect x="1120" y="185" width="400" height="205" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
    <text x="1155" y="235" font-size="30" font-weight="700" fill="#166534">统一双模式</text>
    <text x="1155" y="285" font-size="24" fill="#14532d">/think 与 /no_think</text>
    <text x="1155" y="330" font-size="21" fill="#334155">同一模型切换思考/快速回答</text>
    <text x="1155" y="365" font-size="21" fill="#334155">可在推理中截断 thinking budget</text>
  </g>
  <text x="80" y="465" font-family="system-ui,sans-serif" font-size="31" font-weight="700" fill="#0f172a">预训练：三阶段把“通用 → 推理 → 长上下文”分开优化</text>
  <g font-family="system-ui,sans-serif">
    <rect x="80" y="500" width="390" height="135" rx="20" fill="#e0f2fe"/><text x="110" y="548" font-size="26" font-weight="700" fill="#075985">S1 General</text><text x="110" y="590" font-size="22">30T+ tokens · 4,096 长度</text><text x="110" y="620" font-size="19" fill="#475569">通用知识与 119 种语言</text>
    <path d="M470 568 H555" stroke="#334155" stroke-width="5" marker-end="url(#a)"/>
    <rect x="555" y="500" width="390" height="135" rx="20" fill="#fef3c7"/><text x="585" y="548" font-size="26" font-weight="700" fill="#92400e">S2 Reasoning</text><text x="585" y="590" font-size="22">约 5T 高质量 tokens</text><text x="585" y="620" font-size="19" fill="#475569">提高 STEM / code / synthetic 比例</text>
    <path d="M945 568 H1030" stroke="#334155" stroke-width="5" marker-end="url(#a)"/>
    <rect x="1030" y="500" width="490" height="135" rx="20" fill="#ede9fe"/><text x="1060" y="548" font-size="26" font-weight="700" fill="#5b21b6">S3 Long Context</text><text x="1060" y="590" font-size="22">数百 B tokens · 32,768 训练长度</text><text x="1060" y="620" font-size="19" fill="#475569">ABF + YARN + DCA；推理扩展至 128K</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <text x="80" y="710" font-family="system-ui,sans-serif" font-size="31" font-weight="700" fill="#0f172a">后训练：旗舰走四阶段，小模型走 strong-to-weak</text>
  <text x="100" y="770" font-family="system-ui,sans-serif" font-size="23" fill="#334155">旗舰：Long-CoT cold start → Reasoning RL（3,995 对）→ Thinking Mode Fusion → General RL（20+ tasks）</text>
  <text x="100" y="820" font-family="system-ui,sans-serif" font-size="23" fill="#334155">轻量：off-policy response distillation → on-policy student rollout + teacher-logit KL；教师为 32B 或 235B-A22B</text>
</svg>
