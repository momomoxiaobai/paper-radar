<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3 思考预算与蒸馏实证及边界</title>
  <desc id="desc">展示思考预算上升的四项趋势、8B 蒸馏对 RL 的比较，以及报告未披露和公平性边界。</desc>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="80" y="82" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#111827">两条主证据：思考预算可扩展，小模型蒸馏比同起点 RL 更省</text>
  <text x="80" y="128" font-family="system-ui,sans-serif" font-size="24" fill="#4b5563">但“性能–预算曲线”与“端到端训练总成本”不是同一个问题</text>
  <g font-family="system-ui,sans-serif">
    <rect x="80" y="185" width="700" height="320" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <text x="120" y="238" font-size="30" font-weight="700" fill="#1e40af">Qwen3-235B-A22B：thinking budget 1K → 32K</text>
    <line x1="155" y1="435" x2="700" y2="435" stroke="#94a3b8" stroke-width="3"/>
    <line x1="155" y1="435" x2="155" y2="285" stroke="#94a3b8" stroke-width="3"/>
    <polyline points="175,410 275,402 375,365 475,320 575,285 675,270" fill="none" stroke="#2563eb" stroke-width="6"/>
    <g fill="#2563eb"><circle cx="175" cy="410" r="9"/><circle cx="275" cy="402" r="9"/><circle cx="375" cy="365" r="9"/><circle cx="475" cy="320" r="9"/><circle cx="575" cy="285" r="9"/><circle cx="675" cy="270" r="9"/></g>
    <text x="160" y="468" font-size="19">1K</text><text x="260" y="468" font-size="19">2K</text><text x="360" y="468" font-size="19">4K</text><text x="460" y="468" font-size="19">8K</text><text x="555" y="468" font-size="19">16K</text><text x="655" y="468" font-size="19">32K</text>
    <text x="120" y="282" font-size="21" fill="#1e40af">AIME’24 / AIME’25 / LCB v5 / GPQA 均平滑上升</text>
    <text x="120" y="497" font-size="18" fill="#475569">示意重绘：精确曲线见原文 Figure 2；不同任务增益幅度不同。</text>
    <rect x="830" y="185" width="690" height="320" rx="26" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
    <text x="870" y="238" font-size="30" font-weight="700" fill="#065f46">Qwen3-8B：同一 off-policy 起点</text>
    <text x="870" y="300" font-size="24" fill="#334155">Reasoning RL</text><text x="1175" y="300" font-size="42" font-weight="700" fill="#b45309">17,920 GPUh</text>
    <text x="870" y="365" font-size="24" fill="#334155">On-policy distillation</text><text x="1175" y="365" font-size="42" font-weight="700" fill="#059669">1,800 GPUh</text>
    <text x="870" y="422" font-size="22" fill="#065f46">AIME’24 pass@1：67.6 → 74.4</text>
    <text x="870" y="462" font-size="22" fill="#065f46">LCB v5：52.9 → 60.3；GPQA：61.3 → 63.3</text>
  </g>
  <rect x="80" y="570" width="1440" height="230" rx="26" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
  <text x="120" y="625" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#9a3412">读数边界与未披露项</text>
  <text x="120" y="675" font-family="system-ui,sans-serif" font-size="23" fill="#7c2d12">• 蒸馏表只比较后训练增量 GPU 小时；教师训练与在线 logits 服务成本不在表内，且 GPUh 受实现和硬件影响。</text>
  <text x="120" y="720" font-family="system-ui,sans-serif" font-size="23" fill="#7c2d12">• 闭源基线来自不同提供方与推理预算；AIME 用 64 次采样均值，CodeForces 最多 8 次尝试，不能把表格视为统一 compute 比赛。</text>
  <text x="120" y="765" font-family="system-ui,sans-serif" font-size="23" fill="#7c2d12">• 报告没有给出精确数据配比、去重污染统计、总训练 FLOPs、完整 RL 超参或安全评测；“36T”是规模，不是可复现配方。</text>
</svg>
