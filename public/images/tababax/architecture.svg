<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">TabAbax 架构</title><desc id="d">展示 Fourier 标量编码、两遍列行注意力、行压缩和 12 层上下文学习</desc><rect width="1600" height="900" fill="#f8fafc"/><g font-family="sans-serif" fill="#172033"><text x="800" y="70" text-anchor="middle" font-size="40" font-weight="700">把算力放在 row compression 之前</text><g font-size="24" font-weight="700"><rect x="70" y="180" width="240" height="170" rx="28" fill="#e8edf6"/><text x="190" y="235" text-anchor="middle">表格 X + 标签 y</text><text x="190" y="280" text-anchor="middle" font-size="18" font-weight="400">context rows 有标签</text><text x="190" y="310" text-anchor="middle" font-size="18" font-weight="400">query rows 待预测</text><rect x="370" y="180" width="250" height="170" rx="28" fill="#fff1df"/><text x="495" y="235" text-anchor="middle">Fourier scalar</text><text x="495" y="280" text-anchor="middle" font-size="18" font-weight="400">K=16 learned frequency</text><text x="495" y="310" text-anchor="middle" font-size="18" font-weight="400">sin / cos + missing embedding</text><rect x="680" y="130" width="320" height="270" rx="28" fill="#e9efff" stroke="#6082e5" stroke-width="4"/><text x="840" y="185" text-anchor="middle">Encoding pass 1</text><text x="840" y="235" text-anchor="middle" font-size="20">TFcol：跨样本看同组特征</text><text x="840" y="275" text-anchor="middle" font-size="20">↓</text><text x="840" y="315" text-anchor="middle" font-size="20">TFrow：同一行混合特征</text><text x="840" y="360" text-anchor="middle" font-size="18" font-weight="400">仍保留 feature grid</text><rect x="1060" y="130" width="320" height="270" rx="28" fill="#eaf8f2" stroke="#2f9d72" stroke-width="4"/><text x="1220" y="185" text-anchor="middle">Encoding pass 2</text><text x="1220" y="235" text-anchor="middle" font-size="20">新的 TFcol</text><text x="1220" y="275" text-anchor="middle" font-size="20">↓</text><text x="1220" y="315" text-anchor="middle" font-size="20">新的 TFrow</text><text x="1220" y="360" text-anchor="middle" font-size="18" font-weight="400">untied weights，再算一次交互</text></g><g stroke="#68748c" stroke-width="6"><path d="M310 265 H370"/><path d="M620 265 H680"/><path d="M1000 265 H1060"/></g><rect x="280" y="540" width="1040" height="230" rx="35" fill="#172033"/><text x="800" y="600" text-anchor="middle" font-size="28" font-weight="700" fill="white">[CLS] row compression → 每行一个向量 sᵢ</text><text x="800" y="650" text-anchor="middle" font-size="24" fill="#dbe4f6">TFicl × 12 + QASSMax：query 只选 top q̃·n 个 context rows</text><text x="800" y="700" text-anchor="middle" font-size="24" fill="#a7c2ff">分类：class logits　｜　回归：999 个 quantiles</text><path d="M1220 400 V480 H800 V540" fill="none" stroke="#6c7890" stroke-width="6"/><text x="800" y="825" text-anchor="middle" font-size="22">总体复杂度保持 O(n² + nm²)，ICL backbone 与 TabICLv2 相同</text></g></svg>
