<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">TabAbax 结果</title><desc id="d">展示 TabArena 与 BeyondArena 的总体及回归结果和 prior-only 消融</desc><rect width="1600" height="900" fill="#f8fafc"/><g font-family="sans-serif" fill="#172033"><text x="800" y="70" text-anchor="middle" font-size="40" font-weight="700">最大收益来自“训练任务长什么样”，不是模型变大</text><text x="95" y="145" font-size="26" font-weight="700">TabArena Elo（越高越好）</text><g font-size="20"><text x="95" y="225">Overall</text><text x="95" y="365">Regression</text><text x="95" y="505">Classification</text></g><g fill="#b7c2d7"><rect x="265" y="190" width="468" height="38" rx="10"/><rect x="265" y="330" width="506" height="38" rx="10"/><rect x="265" y="470" width="471" height="38" rx="10"/></g><g fill="#e58a31"><rect x="265" y="245" width="503" height="44" rx="10"/><rect x="265" y="385" width="607" height="44" rx="10"/><rect x="265" y="525" width="494" height="44" rx="10"/></g><g font-size="18"><text x="750" y="220">TabICLv2 1561</text><text x="785" y="279" font-weight="700">TabAbax 1676（+115）</text><text x="788" y="360">TabICLv2 1688</text><text x="889" y="419" font-weight="700">TabAbax 2024</text><text x="753" y="500">TabICLv2 1571</text><text x="776" y="559" font-weight="700">TabAbax 1647（+76）</text></g><rect x="1050" y="150" width="460" height="430" rx="30" fill="#fff1df"/><text x="1280" y="210" text-anchor="middle" font-size="26" font-weight="700">Prior-only 消融</text><text x="1280" y="270" text-anchor="middle" font-size="23">Regression +228 Elo</text><text x="1280" y="310" text-anchor="middle" font-size="19">约占完整 +336 的 2/3</text><text x="1280" y="380" text-anchor="middle" font-size="23">Classification +12 Elo</text><text x="1280" y="420" text-anchor="middle" font-size="19">架构变化贡献更大（+64）</text><text x="1280" y="495" text-anchor="middle" font-size="20">去掉 target monotone warping</text><text x="1280" y="530" text-anchor="middle" font-size="20">主要帮助连续回归目标</text><rect x="95" y="650" width="1415" height="150" rx="28" fill="#172033"/><text x="145" y="710" font-size="24" font-weight="700" fill="white">别把“第 7 / 99”误读成全局 SOTA</text><text x="145" y="755" font-size="21" fill="#dfe6f7">TabAbax 回归很强，但整体仍落后 Kumo、TabPFN-3.5、TabFM、Causilo 等前沿组；且 context rows 弱信号、噪声或分布漂移会静默影响预测。</text></g></svg>
