<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">BOXBOX kernel managed harness updates</title><desc id="d">A trusted kernel separates task execution, review, validation, activation and rollback.</desc><rect width="1600" height="900" rx="32" fill="#f7f9fc"/><g font-family="system-ui,sans-serif"><text x="75" y="72" font-size="38" font-weight="700" fill="#172033">BOXBOX：把 Harness 自改放进一个可恢复的嵌套循环</text>
<rect x="65" y="125" width="560" height="650" rx="28" fill="#eaf1ff" stroke="#5f83cc" stroke-width="3"/><text x="105" y="180" font-size="28" font-weight="700" fill="#2b5597">Task runtime（可编辑 Harness H）</text><rect x="110" y="225" width="465" height="95" rx="18" fill="#fff"/><text x="145" y="267" font-size="22" fill="#33435d">模型动作 a ~ p(M,H)(·|τ)</text><text x="145" y="298" font-size="18" fill="#66758b">改项目、跑 workload、提交 Judge</text><rect x="110" y="360" width="465" height="105" rx="18" fill="#d9e6ff"/><text x="145" y="405" font-size="24" font-weight="700" fill="#2b5597">Agent 调用 boxbox()</text><text x="145" y="438" font-size="18" fill="#536b96">自己决定何时把预算投入 review</text><rect x="110" y="520" width="465" height="185" rx="18" fill="#fff"/><text x="145" y="563" font-size="22" font-weight="700" fill="#33435d">保留的任务上下文</text><text x="145" y="603" font-size="18" fill="#66758b">conversation / workspace / terminal</text><text x="145" y="635" font-size="18" fill="#66758b">running processes / review history</text><text x="145" y="667" font-size="18" fill="#66758b">Harness Git commits</text>
<rect x="690" y="125" width="845" height="650" rx="28" fill="#edf8f2" stroke="#4a9a75" stroke-width="3"/><text x="730" y="180" font-size="28" font-weight="700" fill="#236b50">Kernel（不可由候选 Harness 改写）</text>
<rect x="735" y="225" width="330" height="150" rx="18" fill="#fff"/><text x="770" y="266" font-size="22" font-weight="700" fill="#2f5c4b">1. Trap + Snapshot</text><text x="770" y="305" font-size="18" fill="#5f7069">暂停 interaction loop</text><text x="770" y="337" font-size="18" fill="#5f7069">复制原状态供失败恢复</text>
<rect x="1140" y="225" width="330" height="150" rx="18" fill="#fff"/><text x="1175" y="266" font-size="22" font-weight="700" fill="#2f5c4b">2. 独立 Review</text><text x="1175" y="305" font-size="18" fill="#5f7069">读 τ 与 Harness history</text><text x="1175" y="337" font-size="18" fill="#5f7069">project code 只读，commit H′</text>
<rect x="735" y="435" width="330" height="180" rx="18" fill="#fff"/><text x="770" y="477" font-size="22" font-weight="700" fill="#2f5c4b">3. Validate + Activate</text><text x="770" y="516" font-size="18" fill="#5f7069">接口检查 / runtime load</text><text x="770" y="548" font-size="18" fill="#5f7069">导入 copied state</text><text x="770" y="580" font-size="18" fill="#5f7069">复用同一 terminal session</text>
<rect x="1140" y="435" width="330" height="180" rx="18" fill="#fff3e8"/><text x="1175" y="477" font-size="22" font-weight="700" fill="#8b4b1d">4. Failure → Rollback</text><text x="1175" y="516" font-size="18" fill="#795f4d">保留/恢复 confirmed runtime</text><text x="1175" y="548" font-size="18" fill="#795f4d">带 fault evidence 再 review</text><text x="1175" y="580" font-size="18" fill="#795f4d">外部 side effect 不自动撤销</text>
<path d="M625 410H680" stroke="#5779b6" stroke-width="8" marker-end="url(#a)"/><path d="M1065 300H1130" stroke="#438365" stroke-width="7" marker-end="url(#a)"/><path d="M1305 375V425" stroke="#438365" stroke-width="7" marker-end="url(#a)"/><path d="M1140 530H1075" stroke="#b36a33" stroke-width="7" marker-end="url(#a)"/><path d="M900 625V700H625" fill="none" stroke="#438365" stroke-width="7" marker-end="url(#a)"/>
<rect x="310" y="820" width="980" height="48" rx="20" fill="#172033"/><text x="800" y="851" text-anchor="middle" font-size="20" fill="#fff">新 runtime 改“以后怎样工作”，kernel 保证“改坏了还能继续工作”</text></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#4d6a83"/></marker></defs></svg>
