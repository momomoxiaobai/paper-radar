<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">DeepSeek V3 architecture</title><desc id="d">MLA, MoE routing and multi token prediction compose the model architecture.</desc><rect width="1600" height="900" rx="32" fill="#f7f9fc"/><g font-family="system-ui,sans-serif"><text x="70" y="72" font-size="38" font-weight="700" fill="#172033">DeepSeek‑V3：三条模型侧效率路径</text>
<rect x="60" y="125" width="475" height="650" rx="28" fill="#eaf1ff"/><text x="100" y="180" font-size="28" font-weight="700" fill="#2b5597">MLA：低秩 KV latent</text><rect x="105" y="230" width="385" height="105" rx="18" fill="#fff"/><text x="135" y="272" font-size="22" fill="#33435d">hₜ → cₜᴷⱽ (512 dim)</text><text x="135" y="305" font-size="18" fill="#66758b">共同重建各 head 的 Kᶜ / Vᶜ</text><rect x="105" y="375" width="385" height="105" rx="18" fill="#fff"/><text x="135" y="417" font-size="22" fill="#33435d">hₜ → kₜᴿ (RoPE, 64 dim)</text><text x="135" y="450" font-size="18" fill="#66758b">位置部分与内容压缩解耦</text><rect x="105" y="525" width="385" height="145" rx="18" fill="#dce7ff"/><text x="135" y="568" font-size="22" font-weight="700" fill="#2b5597">生成时只 cache</text><text x="135" y="610" font-size="22" fill="#33435d">cₜᴷⱽ + kₜᴿ</text><text x="135" y="643" font-size="17" fill="#66758b">减少 KV HBM 读写与容量</text>
<rect x="565" y="125" width="475" height="650" rx="28" fill="#edf8f2"/><text x="605" y="180" font-size="28" font-weight="700" fill="#276c52">DeepSeekMoE：稀疏容量</text><text x="605" y="238" font-size="20" fill="#4c655a">每个 MoE layer：</text><rect x="610" y="270" width="385" height="100" rx="18" fill="#fff"/><text x="640" y="313" font-size="22" fill="#315b4c">1 shared expert（始终执行）</text><text x="640" y="345" font-size="18" fill="#66776f">公共能力</text><rect x="610" y="405" width="385" height="125" rx="18" fill="#fff"/><text x="640" y="448" font-size="22" fill="#315b4c">256 routed → Top‑8</text><text x="640" y="481" font-size="18" fill="#66776f">最多跨 4 节点</text><text x="640" y="510" font-size="18" fill="#66776f">fine-grained specialization</text><rect x="610" y="565" width="385" height="125" rx="18" fill="#dff1e8"/><text x="640" y="607" font-size="21" font-weight="700" fill="#276c52">bias 只改“选谁”</text><text x="640" y="640" font-size="18" fill="#66776f">原 affinity 决定 gate 权重</text><text x="640" y="670" font-size="17" fill="#66776f">batch balance + 极小 sequence loss</text>
<rect x="1070" y="125" width="470" height="650" rx="28" fill="#fff2e7"/><text x="1110" y="180" font-size="28" font-weight="700" fill="#8b4b1d">MTP：更密集的未来监督</text><rect x="1115" y="235" width="380" height="105" rx="18" fill="#fff"/><text x="1145" y="278" font-size="22" fill="#674f3d">主模型：预测 tᵢ₊₁</text><text x="1145" y="310" font-size="18" fill="#786454">标准 next-token loss</text><path d="M1305 340V385" stroke="#b66b34" stroke-width="7" marker-end="url(#a)"/><rect x="1115" y="400" width="380" height="130" rx="18" fill="#fff"/><text x="1145" y="443" font-size="22" fill="#674f3d">MTP depth 1：预测 tᵢ₊₂</text><text x="1145" y="476" font-size="18" fill="#786454">共享 Embedding / Output Head</text><text x="1145" y="507" font-size="18" fill="#786454">保持完整因果链</text><rect x="1115" y="575" width="380" height="115" rx="18" fill="#ffe3cb"/><text x="1145" y="617" font-size="21" font-weight="700" fill="#8b4b1d">推理可丢弃或做 draft</text><text x="1145" y="650" font-size="18" fill="#786454">85%–90% acceptance · 1.8× TPS</text>
<rect x="285" y="815" width="1030" height="45" rx="18" fill="#172033"/><text x="800" y="845" text-anchor="middle" font-size="19" fill="#fff">671B total · 37B active/token · 61 layers · 128 heads</text></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#a55f2c"/></marker></defs></svg>
