<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">DeepSeek V3 training pipeline and evidence</title><desc id="d">Training topology, token stages, costs and evaluation boundaries.</desc><rect width="1600" height="900" rx="32" fill="#f7f9fc"/><g font-family="system-ui,sans-serif"><text x="70" y="72" font-size="38" font-weight="700" fill="#172033">训练系统、数据阶段与成本证据</text>
<rect x="60" y="125" width="500" height="650" rx="28" fill="#eaf1ff"/><text x="100" y="180" font-size="27" font-weight="700" fill="#2b5597">2048×H800 训练拓扑</text><text x="100" y="235" font-size="21" fill="#42536e">16-way Pipeline Parallel</text><text x="100" y="275" font-size="21" fill="#42536e">64-way Expert Parallel / 8 nodes</text><text x="100" y="315" font-size="21" fill="#42536e">ZeRO-1 Data Parallel · 无 TP</text><rect x="100" y="360" width="420" height="145" rx="18" fill="#fff"/><text x="130" y="402" font-size="21" font-weight="700" fill="#2b5597">DualPipe</text><text x="130" y="438" font-size="18" fill="#66758b">前/后向相向 micro-batches</text><text x="130" y="470" font-size="18" fill="#66758b">attention/MLP 与 all-to-all 重叠</text><rect x="100" y="545" width="420" height="155" rx="18" fill="#fff"/><text x="130" y="587" font-size="21" font-weight="700" fill="#2b5597">细粒度 FP8</text><text x="130" y="623" font-size="18" fill="#66758b">activation 1×128 · weight 128×128</text><text x="130" y="655" font-size="18" fill="#66758b">每 128 MMA 提升到 FP32 累加</text><text x="130" y="687" font-size="17" fill="#66758b">长期相对 loss error &lt;0.25%</text>
<rect x="590" y="125" width="470" height="650" rx="28" fill="#edf8f2"/><text x="630" y="180" font-size="27" font-weight="700" fill="#276c52">训练流水线</text><rect x="635" y="225" width="380" height="120" rx="18" fill="#fff"/><text x="665" y="267" font-size="22" font-weight="700" fill="#315b4c">Pre-train · 14.8T</text><text x="665" y="302" font-size="18" fill="#66776f">4K · FIM 10% · MTP</text><text x="665" y="328" font-size="16" fill="#66776f">2.664M GPUh</text><path d="M825 345V385" stroke="#4c8c6e" stroke-width="7" marker-end="url(#a)"/><rect x="635" y="400" width="380" height="110" rx="18" fill="#fff"/><text x="665" y="442" font-size="22" font-weight="700" fill="#315b4c">Context · 32K → 128K</text><text x="665" y="477" font-size="18" fill="#66776f">YaRN · 2×1000 steps · 119K GPUh</text><path d="M825 510V550" stroke="#4c8c6e" stroke-width="7" marker-end="url(#a)"/><rect x="635" y="565" width="380" height="125" rx="18" fill="#fff"/><text x="665" y="607" font-size="22" font-weight="700" fill="#315b4c">Post-train · 5K GPUh</text><text x="665" y="640" font-size="18" fill="#66776f">1.5M SFT · R1 distill · GRPO</text><text x="665" y="671" font-size="17" fill="#66776f">RL 规模/超参披露不完整</text>
<rect x="1090" y="125" width="450" height="650" rx="28" fill="#fff2e7"/><text x="1130" y="180" font-size="27" font-weight="700" fill="#8b4b1d">账本与边界</text><text x="1130" y="270" font-size="60" font-weight="750" fill="#a75820">2.788M</text><text x="1130" y="305" font-size="20" fill="#765f4f">H800 GPU-hours（成功流水线）</text><text x="1130" y="375" font-size="54" font-weight="750" fill="#a75820">$5.576M*</text><text x="1130" y="410" font-size="17" fill="#765f4f">* 假设 $2/GPUh，不是总研发成本</text><line x1="1130" y1="455" x2="1495" y2="455" stroke="#dfb78f" stroke-width="2"/><text x="1130" y="510" font-size="21" font-weight="700" fill="#8b4b1d">代表评测（max output 8192）</text><text x="1130" y="552" font-size="18" fill="#765f4f">MMLU-Redux 89.1</text><text x="1130" y="588" font-size="18" fill="#765f4f">LiveCodeBench-CoT 40.5</text><text x="1130" y="624" font-size="18" fill="#765f4f">MATH-500 90.2</text><text x="1130" y="680" font-size="17" fill="#765f4f">缺：污染审计 · 数据配比 · 安全套件</text></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#3f7c61"/></marker></defs></svg>
