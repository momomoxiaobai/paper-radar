<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" rx="36" fill="#08111f"/><text x="80" y="95" fill="#f8fafc" font-size="44" font-family="Arial" font-weight="700">FFH 实验：覆盖能力、闭环与移动端代价</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="90" y="180" width="430" height="250" rx="28" fill="#172554"/><text x="305" y="240" fill="#bfdbfe" font-size="26">50 个真实请求</text><text x="305" y="315" fill="#fff" font-size="56" font-weight="700">50 / 50</text><text x="305" y="365" fill="#cbd5e1" font-size="22">FFH 可表达</text><text x="305" y="402" fill="#94a3b8" font-size="19">Automation: 38 / 50</text>
    <rect x="585" y="180" width="430" height="250" rx="28" fill="#0f766e"/><text x="800" y="240" fill="#ccfbf1" font-size="26">端到端闭环</text><text x="800" y="315" fill="#fff" font-size="56" font-weight="700">44 / 50</text><text x="800" y="365" fill="#cbd5e1" font-size="22">其余 6 个诚实拒绝</text><text x="800" y="402" fill="#94a3b8" font-size="19">Automation: 17 / 50</text>
    <rect x="1080" y="180" width="430" height="250" rx="28" fill="#3b0764"/><text x="1295" y="240" fill="#e9d5ff" font-size="26">重复 commissioned runs</text><text x="1295" y="315" fill="#fff" font-size="56" font-weight="700">46 / 50</text><text x="1295" y="365" fill="#cbd5e1" font-size="22">成功执行，92%</text><text x="1295" y="402" fill="#94a3b8" font-size="19">Tier 3 证据仍很少</text>
    <rect x="90" y="500" width="1420" height="220" rx="28" fill="#111827" stroke="#334155"/><text x="330" y="565" fill="#f8fafc" font-size="25">冷启动</text><text x="330" y="625" fill="#60a5fa" font-size="42" font-weight="700">380 ms</text><text x="650" y="565" fill="#f8fafc" font-size="25">安装 / 替换 / 卸载</text><text x="650" y="625" fill="#5eead4" font-size="35" font-weight="700">178 / 335 / 19 ms</text><text x="1040" y="565" fill="#f8fafc" font-size="25">8 小时电量</text><text x="1040" y="625" fill="#c084fc" font-size="42" font-weight="700">4.1%</text><text x="1320" y="565" fill="#f8fafc" font-size="25">基线</text><text x="1320" y="625" fill="#94a3b8" font-size="35">3.2%</text>
    <text x="800" y="790" fill="#94a3b8" font-size="21">来源：论文 Table 2、Sections 4.2–4.4；设备为 Xiaomi 14 Pro / Android 16</text>
  </g>
</svg>
