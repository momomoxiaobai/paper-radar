<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" rx="36" fill="#08111f"/><text x="80" y="95" fill="#f8fafc" font-size="44" font-family="Arial" font-weight="700">FreeForm Harness：永久角色与开放插件分层</text>
  <g font-family="Arial">
    <rect x="110" y="200" width="1380" height="150" rx="28" fill="#3b0764" stroke="#c084fc" stroke-width="4"/><text x="160" y="260" fill="#e9d5ff" font-size="32" font-weight="700">L₂ Open extensions</text><text x="160" y="310" fill="#fff" font-size="23">可安装、卸载、替换：trigger × data × action × presentation slot × asset</text>
    <rect x="110" y="390" width="1380" height="190" rx="28" fill="#0f766e" stroke="#5eead4" stroke-width="4"/><text x="160" y="450" fill="#ccfbf1" font-size="32" font-weight="700">L₁ Required roles</text><text x="160" y="500" fill="#fff" font-size="23">实现可替换，但角色不可消失：Location Source、Intake Dispatcher、Background Wakeup、Resource Arbiter</text><text x="160" y="540" fill="#99f6e4" font-size="21">吸收位置、进程死亡后的触发恢复、相机/音频/展示槽竞争</text>
    <rect x="110" y="620" width="1380" height="150" rx="28" fill="#172554" stroke="#60a5fa" stroke-width="4"/><text x="160" y="680" fill="#bfdbfe" font-size="32" font-weight="700">L₀ Frozen base</text><text x="160" y="730" fill="#fff" font-size="23">注册表、生命周期、事件日志、契约语义、校验规则与启动市场客户端</text>
    <path d="M800 350 V390 M800 580 V620" stroke="#cbd5e1" stroke-width="7" marker-end="url(#a)"/>
    <rect x="1020" y="120" width="470" height="62" rx="18" fill="#111827" stroke="#475569"/><text x="1255" y="161" fill="#e2e8f0" font-size="21" text-anchor="middle">同一 Plugin Descriptor 贯穿 L₁ / L₂</text>
  </g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#cbd5e1"/></marker></defs>
</svg>
