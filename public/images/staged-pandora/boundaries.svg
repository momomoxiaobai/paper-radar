<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" rx="36" fill="#08111f"/><text x="80" y="95" fill="#f8fafc" font-size="44" font-family="Arial" font-weight="700">结论边界：独立 arms、共享信息与可计算性</text>
  <g font-family="Arial">
    <rect x="90" y="180" width="450" height="500" rx="28" fill="#0f766e"/><text x="315" y="250" fill="#ccfbf1" font-size="30" text-anchor="middle">精确成立</text><text x="135" y="320" fill="#fff" font-size="23">• 有限阶段、读数有界</text><text x="135" y="370" fill="#fff" font-size="23">• 正的 own-history cost</text><text x="135" y="420" fill="#fff" font-size="23">• 其他 arm 的 law 不变</text><text x="135" y="470" fill="#fff" font-size="23">• action loss 可精确分解</text><text x="135" y="520" fill="#fff" font-size="23">• 更多 collection rights 单调增值</text><text x="135" y="570" fill="#fff" font-size="23">• 确定读数无需 resumption</text>
    <rect x="575" y="180" width="450" height="500" rx="28" fill="#172554"/><text x="800" y="250" fill="#bfdbfe" font-size="30" text-anchor="middle">共享信息时</text><text x="620" y="320" fill="#fff" font-size="23">• 仅看各 arm 边际 law 不够</text><text x="620" y="370" fill="#fff" font-size="23">• collection rights 会改变首选 arm</text><text x="620" y="420" fill="#fff" font-size="23">• 每次观察后重算 index</text><text x="620" y="485" fill="#60a5fa" font-size="28">Regret ≤ 2H ε̄</text><text x="620" y="540" fill="#94a3b8" font-size="20">要求所有可达历史上的</text><text x="620" y="575" fill="#94a3b8" font-size="20">local-value 变化都受控</text>
    <rect x="1060" y="180" width="450" height="500" rx="28" fill="#3b0764"/><text x="1285" y="250" fill="#e9d5ff" font-size="30" text-anchor="middle">论文没有证明</text><text x="1105" y="320" fill="#fff" font-size="23">• 实际 HPO benchmark 胜率</text><text x="1105" y="370" fill="#fff" font-size="23">• GP surrogate 的正确性</text><text x="1105" y="420" fill="#fff" font-size="23">• 连续候选空间可扩展性</text><text x="1105" y="470" fill="#fff" font-size="23">• 深梯子高效精确计算</text><text x="1105" y="520" fill="#fff" font-size="23">• 无界高斯 law 的原样适用</text><text x="1105" y="570" fill="#fff" font-size="23">• 模型错设下的鲁棒性</text>
    <text x="800" y="790" fill="#94a3b8" font-size="21" text-anchor="middle">数值实验使用已知有限 law 与有理数精确计算，验证定理身份，不是实际优化性能比较</text>
  </g>
</svg>
