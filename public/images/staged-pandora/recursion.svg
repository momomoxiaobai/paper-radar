<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" rx="36" fill="#08111f"/><text x="80" y="95" fill="#f8fafc" font-size="44" font-family="Arial" font-weight="700">Staged Pandora：从未来可收集结果反推 reservation index</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="90" y="235" width="330" height="280" rx="28" fill="#172554" stroke="#60a5fa" stroke-width="4"/><text x="255" y="300" fill="#bfdbfe" font-size="30">下一阶段</text><text x="255" y="365" fill="#fff" font-size="24">collectable: Ỹ = Y</text><text x="255" y="415" fill="#fff" font-size="24">不可收集: Ỹ = −∞</text><text x="255" y="465" fill="#94a3b8" font-size="20">观察仍可影响后续决策</text>
    <path d="M440 375 H570" stroke="#64748b" stroke-width="6" marker-end="url(#a)"/>
    <rect x="590" y="235" width="420" height="280" rx="28" fill="#0f766e" stroke="#5eead4" stroke-width="4"/><text x="800" y="300" fill="#ccfbf1" font-size="30">Nested value</text><text x="800" y="370" fill="#fff" font-size="31">W(s) = max{Ỹ, Z(s′)}</text><text x="800" y="430" fill="#fff" font-size="25">继续价值与本阶段奖赏取最大</text><text x="800" y="475" fill="#99f6e4" font-size="20">从梯子末端向前递归</text>
    <path d="M1030 375 H1155" stroke="#64748b" stroke-width="6" marker-end="url(#a)"/>
    <rect x="1175" y="205" width="335" height="340" rx="28" fill="#3b0764" stroke="#c084fc" stroke-width="4"/><text x="1342" y="275" fill="#e9d5ff" font-size="30">Reservation</text><text x="1342" y="345" fill="#fff" font-size="26">E[(W−G)⁺] = c(s)</text><text x="1342" y="410" fill="#fff" font-size="27">Z(s)=min{G,W}</text><text x="1342" y="475" fill="#e9d5ff" font-size="21">成本把未来价值截成 covered call</text>
    <rect x="150" y="650" width="1300" height="115" rx="24" fill="#111827" stroke="#334155"/><text x="800" y="700" fill="#f8fafc" font-size="27">策略：若 maxᵢ Gᵢ ≤ incumbent 则停止；否则推进 G 最大的候选</text><text x="800" y="740" fill="#94a3b8" font-size="21">独立候选下精确最优；共享 surrogate 下只剩带条件的近似保证</text>
  </g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#64748b"/></marker></defs>
</svg>
