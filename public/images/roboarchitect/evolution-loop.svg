<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="900"
  viewBox="0 0 1600 900"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">RoboArchitect 自动进化机器人 Harness 的闭环</title>
  <desc id="desc">
    冻结 VLA 被 Harness 包裹，执行轨迹由编码模型审阅并生成新
    Harness，只有训练集成绩提高时才接受。
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07151a" />
      <stop offset="1" stop-color="#12302c" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="14"
        flood-color="#020617"
        flood-opacity="0.55"
      />
    </filter>
    <marker
      id="arrow"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="8"
      markerHeight="8"
      orient="auto"
    >
      <path d="M0 0L10 5L0 10z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)" />
  <text
    x="86"
    y="88"
    fill="#f8fafc"
    font-family="Inter, PingFang SC, sans-serif"
    font-size="42"
    font-weight="700"
  >
    RoboArchitect：把失败 rollout 变成下一版 Harness
  </text>
  <text
    x="86"
    y="136"
    fill="#94a3b8"
    font-family="Inter, PingFang SC, sans-serif"
    font-size="21"
  >
    根据论文 Figures 1-2 重绘；模型权重始终冻结
  </text>

  <g filter="url(#shadow)" font-family="Inter, PingFang SC, sans-serif">
    <rect
      x="100"
      y="220"
      width="360"
      height="210"
      rx="28"
      fill="#0f2530"
      stroke="#22d3ee"
      stroke-width="2"
    />
    <text x="140" y="275" fill="#67e8f9" font-size="25" font-weight="700">
      机器人 Agent
    </text>
    <rect x="145" y="310" width="270" height="72" rx="18" fill="#173b40" />
    <text
      x="280"
      y="343"
      text-anchor="middle"
      fill="#f8fafc"
      font-size="23"
      font-weight="700"
    >
      可改写 Harness
    </text>
    <text x="280" y="369" text-anchor="middle" fill="#a7f3d0" font-size="16">
      控制流 · 工具 · 记忆
    </text>
    <rect x="190" y="397" width="180" height="50" rx="25" fill="#334155" />
    <text x="280" y="429" text-anchor="middle" fill="#e2e8f0" font-size="19">
      冻结 VLA 策略
    </text>

    <rect
      x="620"
      y="190"
      width="360"
      height="250"
      rx="28"
      fill="#132330"
      stroke="#60a5fa"
      stroke-width="2"
    />
    <text x="660" y="247" fill="#93c5fd" font-size="25" font-weight="700">
      执行与完整日志
    </text>
    <text x="660" y="300" fill="#cbd5e1" font-size="20">
      • 相机 / 深度 / 关节状态
    </text>
    <text x="660" y="340" fill="#cbd5e1" font-size="20">
      • 策略动作与工具输出
    </text>
    <text x="660" y="380" fill="#cbd5e1" font-size="20">
      • 成功、碰撞、卡死与重试
    </text>
    <text x="660" y="420" fill="#7dd3fc" font-size="18">
      训练 episodes 只用于优化程序
    </text>

    <rect
      x="1140"
      y="220"
      width="360"
      height="210"
      rx="28"
      fill="#241b35"
      stroke="#a78bfa"
      stroke-width="2"
    />
    <text x="1180" y="277" fill="#c4b5fd" font-size="25" font-weight="700">
      编码模型审阅
    </text>
    <text x="1180" y="327" fill="#ddd6fe" font-size="20">
      聚类失败 → 找到根因
    </text>
    <text x="1180" y="367" fill="#ddd6fe" font-size="20">
      写控制补丁 / 新工具调用
    </text>
    <text x="1180" y="407" fill="#ddd6fe" font-size="20">
      调整策略与程序的控制权
    </text>

    <line
      x1="460"
      y1="325"
      x2="605"
      y2="325"
      stroke="#94a3b8"
      stroke-width="4"
      marker-end="url(#arrow)"
    />
    <line
      x1="980"
      y1="325"
      x2="1125"
      y2="325"
      stroke="#94a3b8"
      stroke-width="4"
      marker-end="url(#arrow)"
    />
    <path
      d="M1320 430 C1320 540 800 540 800 470"
      fill="none"
      stroke="#94a3b8"
      stroke-width="4"
      marker-end="url(#arrow)"
    />
    <path
      d="M620 400 C500 540 280 520 280 460"
      fill="none"
      stroke="#94a3b8"
      stroke-width="4"
      marker-end="url(#arrow)"
    />
  </g>

  <g font-family="Inter, PingFang SC, sans-serif">
    <rect
      x="100"
      y="570"
      width="1400"
      height="235"
      rx="28"
      fill="#0d211f"
      stroke="#166534"
      stroke-width="2"
    />
    <text x="140" y="626" fill="#86efac" font-size="26" font-weight="700">
      Harness 逐轮获得的能力
    </text>
    <rect x="140" y="670" width="300" height="84" rx="20" fill="#14342f" />
    <text
      x="290"
      y="704"
      text-anchor="middle"
      fill="#f0fdf4"
      font-size="21"
      font-weight="700"
    >
      失败恢复
    </text>
    <text x="290" y="735" text-anchor="middle" fill="#a7f3d0" font-size="17">
      检测 jam，抬升后重试
    </text>
    <rect x="475" y="670" width="300" height="84" rx="20" fill="#14342f" />
    <text
      x="625"
      y="704"
      text-anchor="middle"
      fill="#f0fdf4"
      font-size="21"
      font-weight="700"
    >
      新运动原语
    </text>
    <text x="625" y="735" text-anchor="middle" fill="#a7f3d0" font-size="17">
      侧向伸入、拉门、增力
    </text>
    <rect x="810" y="670" width="300" height="84" rx="20" fill="#14342f" />
    <text
      x="960"
      y="704"
      text-anchor="middle"
      fill="#f0fdf4"
      font-size="21"
      font-weight="700"
    >
      动态接管
    </text>
    <text x="960" y="735" text-anchor="middle" fill="#a7f3d0" font-size="17">
      策略失效时 code-as-policy
    </text>
    <rect x="1145" y="670" width="300" height="84" rx="20" fill="#14342f" />
    <text
      x="1295"
      y="704"
      text-anchor="middle"
      fill="#f0fdf4"
      font-size="21"
      font-weight="700"
    >
      持久记忆
    </text>
    <text x="1295" y="735" text-anchor="middle" fill="#a7f3d0" font-size="17">
      抓取高度、姿态、机器人校准
    </text>
  </g>
</svg>
