<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Sinkhorn global convergence mechanism</title><desc id="d">Alternating normalization becomes a vector map with a scale invariant spectral potential.</desc><rect width="1600" height="900" rx="32" fill="#f7f9fc"/><g font-family="system-ui,sans-serif"><text x="70" y="72" font-size="38" font-weight="700" fill="#172033">Sinkhorn 全局收敛：算法、动力系统、势函数、谱收缩</text>
<rect x="60" y="125" width="350" height="640" rx="28" fill="#eaf1ff"/><text x="95" y="180" font-size="27" font-weight="700" fill="#2b5597">交替归一化</text><rect x="100" y="235" width="270" height="100" rx="18" fill="#fff"/><text x="235" y="276" text-anchor="middle" font-size="22" fill="#33435d">列归一化</text><text x="235" y="310" text-anchor="middle" font-size="18" fill="#66758b">c(A) → 1</text><path d="M235 335V380" stroke="#547bbf" stroke-width="7" marker-end="url(#a)"/><rect x="100" y="395" width="270" height="100" rx="18" fill="#fff"/><text x="235" y="436" text-anchor="middle" font-size="22" fill="#33435d">行归一化</text><text x="235" y="470" text-anchor="middle" font-size="18" fill="#66758b">r(A) → 1</text><path d="M235 495V540" stroke="#547bbf" stroke-width="7" marker-end="url(#a)"/><rect x="100" y="555" width="270" height="140" rx="18" fill="#dce7ff"/><text x="235" y="598" text-anchor="middle" font-size="21" font-weight="700" fill="#2b5597">一个完整 cycle</text><text x="235" y="635" text-anchor="middle" font-size="18" fill="#526b98">A²ᵗ = 𝒜(wₜ)</text><text x="235" y="668" text-anchor="middle" font-size="18" fill="#526b98">wₜ₊₁ = ℱ(wₜ)</text>
<rect x="465" y="125" width="520" height="640" rx="28" fill="#edf8f2"/><text x="505" y="180" font-size="27" font-weight="700" fill="#276c52">尺度不变势函数</text><text x="725" y="270" text-anchor="middle" font-size="31" font-weight="700" fill="#245d49">Φ(w)=⟨w²⟩⟨w⁻²⟩−1</text><text x="505" y="325" font-size="19" fill="#5e7069">• Φ(cw)=Φ(w)：消除公共尺度</text><text x="505" y="365" font-size="19" fill="#5e7069">• 同时惩罚极大与接近 0 的坐标</text><text x="505" y="405" font-size="19" fill="#5e7069">• 初始 Φ(w₀) ≤ exp(4D)</text><rect x="515" y="460" width="420" height="170" rx="20" fill="#fff"/><text x="725" y="512" text-anchor="middle" font-size="21" font-weight="700" fill="#276c52">全局收缩（任意 w&gt;0）</text><text x="725" y="565" text-anchor="middle" font-size="25" fill="#245d49">Φ(ℱ(w)) ≤ (1+s₂⁴)/2 · Φ(w)</text><text x="725" y="606" text-anchor="middle" font-size="17" fill="#65776f">P = BᵀB 在 1⊥ 上收缩</text><text x="725" y="692" text-anchor="middle" font-size="19" fill="#5e7069">势足够小 → 每列误差 ≤ ε/n</text>
<rect x="1040" y="125" width="500" height="640" rx="28" fill="#fff2e7"/><text x="1080" y="180" font-size="27" font-weight="700" fill="#8b4b1d">两个互补参数</text><rect x="1080" y="235" width="420" height="150" rx="18" fill="#fff"/><text x="1115" y="280" font-size="23" font-weight="700" fill="#8b4b1d">距离 D</text><text x="1115" y="320" font-size="18" fill="#765f4f">从输入尺度走到精确缩放</text><text x="1115" y="352" font-size="18" fill="#765f4f">决定初始势有多大</text><rect x="1080" y="420" width="420" height="150" rx="18" fill="#fff"/><text x="1115" y="465" font-size="23" font-weight="700" fill="#8b4b1d">谱隙 g=1−s₂(B)²</text><text x="1115" y="505" font-size="18" fill="#765f4f">端点两步随机游走混合</text><text x="1115" y="537" font-size="18" fill="#765f4f">决定每 cycle 衰减速度</text><text x="1290" y="650" text-anchor="middle" font-size="25" font-weight="750" fill="#a75820">O((D+log n+log 1/ε)/g)</text><text x="1290" y="695" text-anchor="middle" font-size="18" fill="#765f4f">完整 cycle（渐近表达）</text><path d="M410 445H455" stroke="#5074a8" stroke-width="8" marker-end="url(#a)"/><path d="M985 445H1030" stroke="#3e7f63" stroke-width="8" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#4d6a83"/></marker></defs></svg>
