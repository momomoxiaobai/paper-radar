<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Sinkhorn theorem map</title><desc id="d">A theorem map relates global convergence, spectral certificates, dense matrices and boundary lower bounds.</desc><rect width="1600" height="900" rx="32" fill="#f7f9fc"/><g font-family="system-ui,sans-serif"><text x="70" y="72" font-size="38" font-weight="700" fill="#172033">定理地图：什么时候快，为什么严格条件不能放松</text>
<rect x="80" y="135" width="620" height="210" rx="26" fill="#eaf1ff" stroke="#6085cc" stroke-width="3"/><text x="120" y="190" font-size="27" font-weight="700" fill="#2b5597">全局动力学定理</text><text x="120" y="240" font-size="22" fill="#354761">任意可有限缩放 A，g&gt;0</text><text x="120" y="282" font-size="26" font-weight="700" fill="#2b5597">cycles = O((D + log n + log 1/ε) / g)</text><text x="120" y="318" font-size="17" fill="#65758e">无密度或 expansion 假设</text>
<rect x="80" y="420" width="620" height="330" rx="26" fill="#edf8f2" stroke="#4c9875" stroke-width="3"/><text x="120" y="475" font-size="27" font-weight="700" fill="#276c52">怎样证明 D 小</text><text x="120" y="530" font-size="21" font-weight="700" fill="#315b4c">输入证书</text><text x="300" y="530" font-size="22" fill="#276c52">√K · σ &lt; 1</text><text x="120" y="580" font-size="21" font-weight="700" fill="#315b4c">混合证书</text><text x="300" y="580" font-size="22" fill="#276c52">√K · σ · s₂(B) &lt; 1</text><text x="120" y="630" font-size="19" fill="#5d7169">固定裕量 ⇒ scaling distortion 为 poly(n)</text><text x="120" y="670" font-size="19" fill="#5d7169">⇒ D=O(log n)</text><text x="120" y="710" font-size="17" fill="#6f7f79">输入证书还同时证明 exact scalability</text>
<rect x="835" y="135" width="685" height="260" rx="26" fill="#fff2e7" stroke="#d28a4c" stroke-width="3"/><text x="875" y="190" font-size="27" font-weight="700" fill="#8b4b1d">紧下界：谱隙快 ≠ 初始距离近</text><text x="875" y="245" font-size="21" fill="#6f5746">K=4，s₂(input)=s₂(endpoint)=1/√2</text><text x="875" y="290" font-size="23" font-weight="700" fill="#a75820">g=1/2，distortion=1+2ⁿ/3</text><text x="875" y="335" font-size="23" font-weight="700" fill="#a75820">D=Θ(n)，T(n⁻²)=Θ(n)</text><text x="875" y="370" font-size="17" fill="#7d695a">D 的线性依赖在固定 gap 下不可删除</text>
<rect x="835" y="460" width="685" height="290" rx="26" fill="#f1ecfb" stroke="#896db5" stroke-width="3"/><text x="875" y="515" font-size="27" font-weight="700" fill="#674d91">Dense matrix 推论与边界</text><text x="875" y="570" font-size="21" fill="#58476f">γ&gt;1/2：大条目邻域必有线性重叠</text><text x="875" y="610" font-size="21" fill="#58476f">⇒ D=O(1)，g=Ω(1)</text><text x="875" y="650" font-size="23" font-weight="700" fill="#674d91">O(log n + log 1/ε)</text><line x1="875" y1="680" x2="1470" y2="680" stroke="#baa9d3" stroke-width="2"/><text x="875" y="720" font-size="18" fill="#75658b">边界 γ=1/2、σ=1/2：存在 Ω(n²) 慢实例</text><path d="M390 345V410" stroke="#5b7ebd" stroke-width="8" marker-end="url(#a)"/><path d="M700 245H825" stroke="#b06a34" stroke-width="8" marker-end="url(#a)"/><path d="M700 600H825" stroke="#5b7f68" stroke-width="8" marker-end="url(#a)"/><rect x="330" y="815" width="940" height="45" rx="18" fill="#172033"/><text x="800" y="845" text-anchor="middle" font-size="19" fill="#fff">严格谱裕量给“可缩放且不太远”；等号边界允许指数 distortion</text></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#4d6a83"/></marker></defs></svg>
