<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Req2Rust 工作流</title><desc id="d">从源码证据到迁移需求规格、Rust 设计规格、初始项目及三类验证器闭环</desc><rect width="1600" height="900" fill="#f8fafc"/><g font-family="sans-serif" fill="#172033"><text x="800" y="70" text-anchor="middle" font-size="40" font-weight="700">先固定“必须保留什么”，再决定“Rust 怎么写”</text>
  <g font-size="25" font-weight="700"><rect x="70" y="180" width="260" height="150" rx="25" fill="#e8edf6"/><text x="200" y="245" text-anchor="middle">C++ 项目证据</text><text x="200" y="285" text-anchor="middle" font-size="19" font-weight="400">源码 / API / build / tests</text><rect x="395" y="180" width="310" height="150" rx="25" fill="#e9efff" stroke="#6385e8" stroke-width="4"/><text x="550" y="235" text-anchor="middle">MRS</text><text x="550" y="275" text-anchor="middle" font-size="19" font-weight="400">语言无关的 preservation obligations</text><text x="550" y="302" text-anchor="middle" font-size="19" font-weight="400">接口、状态、资源、依赖、边界</text><rect x="770" y="180" width="310" height="150" rx="25" fill="#eaf8f2" stroke="#3aa578" stroke-width="4"/><text x="925" y="235" text-anchor="middle">RDS</text><text x="925" y="275" text-anchor="middle" font-size="19" font-weight="400">文件、模块、owned symbols</text><text x="925" y="302" text-anchor="middle" font-size="19" font-weight="400">实现单元 ↔ MRS coverage</text><rect x="1145" y="180" width="385" height="150" rx="25" fill="#fff2e4" stroke="#e78a31" stroke-width="4"/><text x="1338" y="235" text-anchor="middle">初始 Rust crate</text><text x="1338" y="275" text-anchor="middle" font-size="19" font-weight="400">marker skeleton + 并行单元生成</text><text x="1338" y="302" text-anchor="middle" font-size="19" font-weight="400">它是 refinement state，不是终稿</text></g>
  <g stroke="#65728c" stroke-width="6" fill="none"><path d="M330 255 H395"/><path d="M705 255 H770"/><path d="M1080 255 H1145"/></g><g fill="#65728c"><path d="M390 243 l18 12 -18 12z"/><path d="M765 243 l18 12 -18 12z"/><path d="M1140 243 l18 12 -18 12z"/></g>
  <rect x="180" y="460" width="1240" height="320" rx="35" fill="#172033"/><text x="800" y="515" text-anchor="middle" font-size="29" font-weight="700" fill="white">Agent-Harnessed Refinement</text><g font-size="22"><rect x="250" y="565" width="280" height="120" rx="20" fill="#e9efff"/><text x="390" y="615" text-anchor="middle">Compiler validator</text><text x="390" y="650" text-anchor="middle" font-size="18">build / type / missing item</text><rect x="660" y="565" width="280" height="120" rx="20" fill="#eaf8f2"/><text x="800" y="615" text-anchor="middle">Semantic validator</text><text x="800" y="650" text-anchor="middle" font-size="18">MRS ↔ observable behavior</text><rect x="1070" y="565" width="280" height="120" rx="20" fill="#fff2e4"/><text x="1210" y="608" text-anchor="middle">Unsafe validator</text><text x="1210" y="640" text-anchor="middle" font-size="16">necessary boundary unsafe</text><text x="1210" y="664" text-anchor="middle" font-size="16">vs reducible unsafe</text></g><path d="M1338 330 V420 H800 V460" stroke="#e78a31" stroke-width="6" fill="none"/><path d="M800 780 V840 H1338 V330" stroke="#77839c" stroke-width="6" fill="none"/><text x="800" y="835" text-anchor="middle" font-size="20">validation reports → scoped repair → rebuild → revalidate</text></g></svg>
