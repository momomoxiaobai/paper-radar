<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Req2Rust 关键结果</title><desc id="d">通用项目、OpenHarmony 及消融实验结果</desc><rect width="1600" height="900" fill="#f8fafc"/><g font-family="sans-serif" fill="#172033"><text x="800" y="70" text-anchor="middle" font-size="40" font-weight="700">“能编译”与“保留行为”是两道不同的门</text><text x="110" y="150" font-size="26" font-weight="700">测试通过率</text><g font-size="22"><text x="110" y="230">通用 C++ 项目（7）</text><text x="110" y="370">OpenHarmony 模块（5）</text></g><g><rect x="400" y="190" width="800" height="46" rx="12" fill="#dde4f0"/><rect x="400" y="190" width="735" height="46" rx="12" fill="#5b4bd6"/><text x="1155" y="223" font-size="22" font-weight="700">Req2Rust 91.9%</text><rect x="400" y="250" width="556" height="40" rx="10" fill="#a9b5cb"/><text x="975" y="280" font-size="20">ClaudeCode 69.5%</text><rect x="400" y="330" width="800" height="46" rx="12" fill="#dde4f0"/><rect x="400" y="330" width="703" height="46" rx="12" fill="#2e9a70"/><text x="1122" y="363" font-size="22" font-weight="700">Req2Rust 87.9%</text><rect x="400" y="390" width="363" height="40" rx="10" fill="#a9b5cb"/><text x="783" y="420" font-size="20">ClaudeCode 45.4%</text></g>
  <rect x="95" y="510" width="1410" height="275" rx="30" fill="#172033"/><text x="145" y="570" font-size="27" font-weight="700" fill="white">七个通用项目上的消融</text><g font-size="21" fill="#dfe6f7"><text x="145" y="630">Full：7/7 build，91.90% tests，1.78% unsafe</text><text x="145" y="675">去掉 semantic validator：仍 7/7 build，但 tests 跌到 28.10%</text><text x="145" y="720">去掉 unsafe reduction：tests 不变，unsafe 从 1.78% 升到 5.00%</text><text x="145" y="765">Initial Rust only：0/7 build —— 初稿只是 Harness 的工作对象</text></g><text x="1060" y="620" font-size="25" font-weight="700" fill="#ffcf8a">重要警告</text><text x="1060" y="665" font-size="19" fill="#fff2df">作者只与一个 coding-agent baseline 比较，</text><text x="1060" y="700" font-size="19" fill="#fff2df">两边虽用同一底模，prompt / harness budget</text><text x="1060" y="735" font-size="19" fill="#fff2df">和多次运行方差披露仍不足。</text></g></svg>
