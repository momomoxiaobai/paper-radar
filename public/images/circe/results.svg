<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Circe 关键实验结果</title><desc id="d">四域 AUROC 提升、组件消融和计算开销</desc><rect width="1600" height="900" fill="#f7f8fc"/><g font-family="sans-serif" fill="#172033"><text x="800" y="76" text-anchor="middle" font-size="40" font-weight="700">正确性排序更好，但不是“自动判真器”</text>
  <text x="95" y="145" font-size="25" font-weight="700">相对每域最强 baseline 的 AUROC 提升</text><g font-size="21"><text x="95" y="213">数学</text><text x="95" y="293">推理</text><text x="95" y="373">知识</text><text x="95" y="453">理解</text></g><g fill="#5b4bd6"><rect x="210" y="180" width="590" height="48" rx="12"/><rect x="210" y="260" width="250" height="48" rx="12"/><rect x="210" y="340" width="409" height="48" rx="12"/><rect x="210" y="420" width="425" height="48" rx="12"/></g><g font-size="23" font-weight="700"><text x="820" y="214">+7.37</text><text x="480" y="294">+3.13</text><text x="639" y="374">+5.11</text><text x="655" y="454">+5.31 个百分点</text></g>
  <rect x="920" y="140" width="580" height="355" rx="28" fill="#e9efff"/><text x="1210" y="195" text-anchor="middle" font-size="27" font-weight="700">五模型平均消融 AUROC</text><g font-size="21"><text x="980" y="260">CIC only</text><text x="980" y="315">RG only</text><text x="980" y="370">LC only</text><text x="980" y="425">三者融合</text></g><g fill="#9baee8"><rect x="1120" y="235" width="263" height="32" rx="8"/><rect x="1120" y="290" width="265" height="32" rx="8"/><rect x="1120" y="345" width="238" height="32" rx="8"/></g><rect x="1120" y="400" width="287" height="32" rx="8" fill="#5b4bd6"/><g font-size="20" font-weight="700"><text x="1395" y="260">65.90</text><text x="1397" y="315">66.16</text><text x="1370" y="370">59.52</text><text x="1420" y="425">71.76</text></g>
  <rect x="95" y="550" width="1405" height="240" rx="28" fill="#172033"/><text x="145" y="615" font-size="27" font-weight="700" fill="white">使用边界</text><g font-size="22" fill="#dfe6f7"><text x="145" y="670">• 需要白盒访问并对同一个 FFN 做“有 / 无 attention update”两次计算</text><text x="145" y="715">• 领域权重用带正确标签的 development set 选择，因此 training-free ≠ label-free</text><text x="145" y="760">• Llama3-8B / GSM8K：额外 0.67s，对比基础生成 3.69s，约 +18%</text></g></g>
</svg>
