<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Circe 三路正确性信号</title><desc id="d">组件交互一致性、表征几何和似然置信度融合为回答正确性分数</desc>
  <rect width="1600" height="900" fill="#f7f8fc"/><text x="800" y="76" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="700" fill="#172033">一次生成，三条证据链</text>
  <g font-family="sans-serif" fill="#172033"><rect x="90" y="150" width="1420" height="130" rx="28" fill="#172033"/><text x="800" y="210" text-anchor="middle" font-size="30" fill="white">Prompt → Transformer 层 1 … 层 L → Response y[1:T]</text><text x="800" y="250" text-anchor="middle" font-size="21" fill="#c8d2ec">同时保留 attention update、FFN output、residual hidden state 与 token probability</text>
  <rect x="90" y="350" width="430" height="300" rx="28" fill="#e9efff" stroke="#6285e8" stroke-width="4"/><text x="305" y="410" text-anchor="middle" font-size="30" font-weight="700">CIC</text><text x="305" y="450" text-anchor="middle" font-size="21">组件交互一致性</text><path d="M170 520 C250 450 330 590 430 500" fill="none" stroke="#3e66d6" stroke-width="12"/><path d="M170 585 C260 515 345 640 430 555" fill="none" stroke="#8aa4ef" stroke-width="12"/><text x="305" y="625" text-anchor="middle" font-size="19">早层 attention 方向</text><text x="305" y="648" text-anchor="middle" font-size="19">是否对齐晚层 attention-induced FFN change</text>
  <rect x="585" y="350" width="430" height="300" rx="28" fill="#eaf8f2" stroke="#39a77a" stroke-width="4"/><text x="800" y="410" text-anchor="middle" font-size="30" font-weight="700">RG</text><text x="800" y="450" text-anchor="middle" font-size="21">表征几何</text><polyline points="670,585 720,520 785,548 850,475 930,530" fill="none" stroke="#2d9b70" stroke-width="12"/><g fill="#2d9b70"><circle cx="670" cy="585" r="12"/><circle cx="720" cy="520" r="12"/><circle cx="785" cy="548" r="12"/><circle cx="850" cy="475" r="12"/><circle cx="930" cy="530" r="12"/></g><text x="800" y="625" text-anchor="middle" font-size="19">跨层位移 dℓ 与转角 θℓ</text><text x="800" y="648" text-anchor="middle" font-size="19">描述 residual trajectory 的整体形状</text>
  <rect x="1080" y="350" width="430" height="300" rx="28" fill="#fff3e6" stroke="#e38a32" stroke-width="4"/><text x="1295" y="410" text-anchor="middle" font-size="30" font-weight="700">LC</text><text x="1295" y="450" text-anchor="middle" font-size="21">似然置信度</text><text x="1295" y="535" text-anchor="middle" font-size="34" font-weight="700">NLL = −mean log p(y_t)</text><text x="1295" y="590" text-anchor="middle" font-size="34" font-weight="700">LC = 1 / (1 + NLL)</text><text x="1295" y="640" text-anchor="middle" font-size="19">输出概率高不等于正确，但可作互补证据</text>
  <path d="M305 650 V725 H710" fill="none" stroke="#60708f" stroke-width="5"/><path d="M800 650 V725" fill="none" stroke="#60708f" stroke-width="5"/><path d="M1295 650 V725 H890" fill="none" stroke="#60708f" stroke-width="5"/><rect x="600" y="715" width="400" height="110" rx="28" fill="#5b4bd6"/><text x="800" y="765" text-anchor="middle" font-size="28" font-weight="700" fill="white">sCirce</text><text x="800" y="800" text-anchor="middle" font-size="20" fill="#eeeaff">内部信号先融合，再与 LC 加权</text></g>
</svg>
