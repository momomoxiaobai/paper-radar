<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" rx="36" fill="#08111f"/>
  <text x="80" y="95" fill="#f8fafc" font-size="44" font-family="Arial" font-weight="700">LoopVQ：沿 loop 轴共享一个向量量化索引</text>
  <text x="80" y="145" fill="#94a3b8" font-size="24" font-family="Arial">同一层在四次循环中产生相关 KV；把四个 loop step 的通道拼进同一 code</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="90" y="230" width="245" height="130" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="4"/><text x="212" y="285" fill="#bfdbfe" font-size="28">Loop 1</text><text x="212" y="325" fill="#fff" font-size="22">c 个通道</text>
    <rect x="90" y="390" width="245" height="130" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="4"/><text x="212" y="445" fill="#bfdbfe" font-size="28">Loop 2</text><text x="212" y="485" fill="#fff" font-size="22">c 个通道</text>
    <rect x="90" y="550" width="245" height="130" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="4"/><text x="212" y="605" fill="#bfdbfe" font-size="28">Loop 3 / 4</text><text x="212" y="645" fill="#fff" font-size="22">各 c 个通道</text>
    <path d="M350 295 H520 M350 455 H520 M350 615 H520" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
    <rect x="540" y="285" width="330" height="300" rx="28" fill="#0f766e" stroke="#5eead4" stroke-width="4"/>
    <text x="705" y="365" fill="#ccfbf1" font-size="28">Coupled vector</text><text x="705" y="415" fill="#fff" font-size="22">G = T_c × c 维</text><text x="705" y="465" fill="#fff" font-size="22">最近 codebook entry</text><text x="705" y="515" fill="#fff" font-size="22">只存一个 8-bit index</text>
    <path d="M890 435 H1045" stroke="#64748b" stroke-width="6" marker-end="url(#a)"/>
    <rect x="1070" y="240" width="440" height="400" rx="28" fill="#3b0764" stroke="#c084fc" stroke-width="4"/>
    <text x="1290" y="315" fill="#e9d5ff" font-size="30">Loop-aware codebook</text><text x="1290" y="370" fill="#fff" font-size="22">B¹ / B² / B³ / B⁴ 切片</text><text x="1290" y="420" fill="#fff" font-size="22">不同 loop 读取自己的坐标</text><text x="1290" y="480" fill="#fff" font-size="22">以输出 KL 而非重建误差微调</text><text x="1290" y="540" fill="#fff" font-size="22">保留跨 loop 误差传播关系</text><text x="1290" y="590" fill="#f5d0fe" font-size="22">0.5 / 0.25 bit per element</text>
  </g>
  <rect x="90" y="750" width="1420" height="85" rx="20" fill="#111827" stroke="#334155"/><text x="800" y="805" fill="#e2e8f0" font-size="25" font-family="Arial" text-anchor="middle">推理时：sink + recent window 保留 BF16，其余页面存共享索引；每 8 个新 token 编码一次旧页面</text>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12z" fill="#64748b"/></marker></defs>
</svg>
